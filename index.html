<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>16-BIT: Пингвин и Расписание (Mobile Vertical Edition)</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body {
            background: #06080d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #d1d5db;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР (ВЕРТИКАЛЬНЫЙ КОНСОЛЬНЫЙ ФОРМАТ) */
        #console-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 540px; /* Идеальная ширина под телефон */
            max-height: 960px;
            background: linear-gradient(180deg, #111522 0%, #080a10 100%);
            position: relative;
        }

        /* ВЕРХНЯЯ ЧАСТЬ: ИГРОВОЙ ЭКРАН */
        #screen-section {
            position: relative;
            width: 100%;
            flex: 1 1 55%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-bottom: 3px solid #334155;
            padding: 4px;
        }
        canvas {
            display: block;
            background-color: #0b0e14;
            width: 100%;
            height: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }
        .scanlines {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            border-radius: 4px;
        }

        /* ВЕРХНЕЕ МЕНЮ НАД ЭКРАНОМ */
        #top-bar {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        .btn-top {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #475569;
            color: #fff;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .btn-top:active { background: #38bdf8; color: #000; }

        /* НИЖНЯЯ ЧАСТЬ: ПУЛЬТ УПРАВЛЕНИЯ (GAMEPAD) */
        #gamepad-section {
            flex: 1 1 45%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0f1422;
            position: relative;
            border-top: 1px solid #1e293b;
        }

        /* ЛЕВАЯ ЗОНА: ПЛАВАЮЩИЙ ДЖОЙСТИК */
        #joystick-touch-area {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: none;
        }
        #joystick-base {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 2px solid #38bdf8;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }
        #joystick-stick {
            width: 46px;
            height: 46px;
            background: radial-gradient(circle, #38bdf8, #0284c7);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        /* ПРАВАЯ ЗОНА: КНОПКИ ДЕЙСТВИЯ */
        #actions-touch-area {
            flex: 1;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            justify-items: center;
            align-items: center;
            padding-left: 8px;
        }
        .touch-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 5px 12px rgba(0,0,0,0.7);
            touch-action: none;
        }
        .touch-btn:active, .touch-btn.active {
            transform: scale(0.9);
            filter: brightness(1.3);
        }
        .btn-label {
            font-size: 8px;
            letter-spacing: 0.5px;
            margin-top: -2px;
            text-transform: uppercase;
        }

        .btn-atk { background: radial-gradient(circle, #f59e0b, #b45309); border-color: #fbbf24; grid-column: 2; grid-row: 2; width: 62px; height: 62px; }
        .btn-def { background: radial-gradient(circle, #8b5cf6, #5b21b6); border-color: #a78bfa; grid-column: 1; grid-row: 2; }
        .btn-ice { background: radial-gradient(circle, #38bdf8, #0369a1); border-color: #7dd3fc; grid-column: 2; grid-row: 1; }
        .btn-dash { background: radial-gradient(circle, #10b981, #047857); border-color: #34d399; grid-column: 3; grid-row: 2; }
        .btn-ult { background: radial-gradient(circle, #f43f5e, #be123c); border-color: #fda4af; grid-column: 3; grid-row: 1; }

        /* НА ШИРОКИХ ЭКРАНАХ (ПК) */
        @media (min-width: 800px) and (orientation: landscape) {
            #console-wrapper {
                max-width: 900px;
                max-height: 640px;
                flex-direction: row;
            }
            #screen-section {
                flex: 1 1 70%;
                border-bottom: none;
                border-right: 3px solid #334155;
            }
            #gamepad-section {
                flex: 1 1 30%;
                flex-direction: column;
                justify-content: space-around;
            }
            #actions-touch-area {
                padding-left: 0;
            }
        }
    </style>
</head>
<body>

<div id="console-wrapper">
    <!-- ВЕРХ: ИГРОВОЙ ЭКРАН -->
    <div id="screen-section">
        <canvas id="game" width="640" height="448"></canvas>
        <div class="scanlines"></div>

        <div id="top-bar">
            <button class="btn-top" id="btn-inv">🎒 ИНВЕНТАРЬ</button>
            <button class="btn-top" id="btn-swap">🔄 СМЕНА</button>
            <button class="btn-top" id="btn-restart">🔁 R</button>
        </div>
    </div>

    <!-- НИЗ: СЕНСОРНЫЙ ГЕЙМПАД ДЛЯ ТЕЛЕФОНА -->
    <div id="gamepad-section">
        <!-- Левая половина: Плавающий Джойстик -->
        <div id="joystick-touch-area">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <!-- Правая половина: Кнопки ДЕЙСТВИЙ -->
        <div id="actions-touch-area">
            <div class="touch-btn btn-ice" id="btn-ice">
                ❄️<span class="btn-label">ЛЁД</span>
            </div>
            <div class="touch-btn btn-ult" id="btn-ult">
                ⚡<span class="btn-label">УЛЬТА</span>
            </div>
            <div class="touch-btn btn-def" id="btn-def">
                🛡️<span class="btn-label">ЩИТ</span>
            </div>
            <div class="touch-btn btn-atk" id="btn-atk">
                ⚔️<span class="btn-label">УДАР</span>
            </div>
            <div class="touch-btn btn-dash" id="btn-dash">
                💨<span class="btn-label">ДЭШ</span>
            </div>
        </div>
    </div>
</div>

<script>
// --- 16-BIT AUDIO ENGINE ---
let actx = null;
let bgmTimer = null;
let bgmStep = 0;
let musicEnabled = true;

function initAudio() {
    if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        startBGM();
    }
}

const bassNotes = [110, 110, 130, 110, 146, 110, 130, 123];
const leadNotes = [220, 0, 261, 293, 329, 293, 261, 0, 329, 392, 440, 392, 329, 293, 261, 246];

function startBGM() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
        if (!musicEnabled || !actx || inventoryOpen || transition.active) return;
        const t = actx.currentTime;

        const bFreq = bassNotes[bgmStep % bassNotes.length];
        const bOsc = actx.createOscillator();
        const bGain = actx.createGain();
        bOsc.type = 'sawtooth';
        bOsc.frequency.setValueAtTime((currentRoom === 'THRONE' ? bFreq * 1.2 : bFreq) / 2, t);
        bGain.gain.setValueAtTime(0.05, t);
        bGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        bOsc.connect(bGain); bGain.connect(actx.destination);
        bOsc.start(t); bOsc.stop(t + 0.18);

        const lFreq = leadNotes[bgmStep % leadNotes.length];
        if (lFreq > 0) {
            const lOsc = actx.createOscillator();
            const lGain = actx.createGain();
            lOsc.type = 'square';
            lOsc.frequency.setValueAtTime(currentRoom === 'THRONE' ? lFreq * 1.2 : lFreq, t);
            lGain.gain.setValueAtTime(0.025, t);
            lGain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            lOsc.connect(lGain); lGain.connect(actx.destination);
            lOsc.start(t); lOsc.stop(t + 0.15);
        }

        if (bgmStep % 2 === 0) {
            const nOsc = actx.createOscillator();
            const nGain = actx.createGain();
            nOsc.type = 'triangle';
            nOsc.frequency.setValueAtTime(600, t);
            nGain.gain.setValueAtTime(0.02, t);
            nGain.linearRampToValueAtTime(0, t + 0.04);
            nOsc.connect(nGain); nGain.connect(actx.destination);
            nOsc.start(t); nOsc.stop(t + 0.04);
        }
        bgmStep++;
    }, 150);
}

function playSound(type) {
    if (!actx) return;
    const t = actx.currentTime;

    if (type === 'slash') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(360, t);
        osc.frequency.exponentialRampToValueAtTime(70, t + 0.1);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'frost_shuriken') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(1600, t + 0.15);
        gain.gain.setValueAtTime(0.25, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(t); osc.stop(t + 0.15);
    } else if (type === 'freeze') {
        [1046, 1318, 1567].forEach((f, i) => {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(f, t + i * 0.04);
            gain.gain.setValueAtTime(0.2, t + i * 0.04);
            gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.06);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t + i * 0.04); osc.stop(t + (i + 1) * 0.06);
        });
    } else if (type === 'parry') {
        const osc1 = actx.createOscillator(); const gain1 = actx.createGain();
        const osc2 = actx.createOscillator(); const gain2 = actx.createGain();
        osc1.type = 'square'; osc1.frequency.setValueAtTime(987, t);
        osc2.type = 'triangle'; osc2.frequency.setValueAtTime(1975, t);
        gain1.gain.setValueAtTime(0.35, t); gain1.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
        gain2.gain.setValueAtTime(0.25, t); gain2.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
        osc1.connect(gain1); gain1.connect(actx.destination);
        osc2.connect(gain2); gain2.connect(actx.destination);
        osc1.start(t); osc1.stop(t + 0.25);
        osc2.start(t); osc2.stop(t + 0.35);
    } else if (type === 'door_unlock') {
        [523, 587, 659, 698, 783, 880, 987, 1046].forEach((f, i) => {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(f, t + i * 0.07);
            gain.gain.setValueAtTime(0.25, t + i * 0.07);
            gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.07);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t + i * 0.07); osc.stop(t + (i + 1) * 0.07);
        });
    } else if (type === 'door_slam') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, t);
        osc.frequency.linearRampToValueAtTime(40, t + 0.3);
        gain.gain.setValueAtTime(0.4, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'spawn_portal') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(150, t);
        osc.frequency.linearRampToValueAtTime(600, t + 0.25);
        gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(t); osc.stop(t + 0.25);
    } else if (type === 'block') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(200, t);
        gain.gain.setValueAtTime(0.25, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'ult_cast') {
        [440, 554, 659, 880, 1108].forEach((f, i) => {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(f, t + i * 0.06);
            gain.gain.setValueAtTime(0.25, t + i * 0.06);
            gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.08);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t + i * 0.06); osc.stop(t + (i + 1) * 0.08);
        });
    } else if (type === 'coin') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200 + Math.random()*400, t);
        gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(t); osc.stop(t + 0.08);
    } else if (type === 'golden_beam') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t);
        osc.frequency.linearRampToValueAtTime(1200, t + 0.15);
        gain.gain.setValueAtTime(0.25, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(t); osc.stop(t + 0.15);
    } else if (type === 'fanfare') {
        [440, 554, 659, 880].forEach((f, i) => {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(f, t + i * 0.1);
            gain.gain.setValueAtTime(0.2, t + i * 0.1);
            gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.1);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t + i * 0.1); osc.stop(t + (i + 1) * 0.1);
        });
    } else if (type === 'hit') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(130, t);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'item') {
        [523, 659, 783, 1046].forEach((f, i) => {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(f, t + i * 0.05);
            gain.gain.setValueAtTime(0.2, t + i * 0.05);
            gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.05);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t + i * 0.05); osc.stop(t + (i + 1) * 0.05);
        });
    }
}

// --- CANVAS & SETUP ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const keys = {};
let inventoryOpen = false;

window.addEventListener('contextmenu', e => e.preventDefault());

let mousePos = { x: 160, y: 112 };
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = 320 / rect.width;
    const scaleY = 224 / rect.height;
    mousePos.x = (e.clientX - rect.left) * scaleX;
    mousePos.y = (e.clientY - rect.top) * scaleY;
});

window.addEventListener('mousedown', e => {
    initAudio();
    if (e.button === 0) raiseShield();
    else if (e.button === 1) { e.preventDefault(); shootFrostShuriken(); }
    else if (e.button === 2) { e.preventDefault(); performMeleeAttack(); }
});
window.addEventListener('mouseup', e => {
    if (e.button === 0) player.isShielding = false;
});

window.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    if (e.code === 'KeyM') musicEnabled = !musicEnabled;
    if (e.code === 'KeyR') resetGame();
    if (e.code === 'KeyQ') switchWeapon();
    if (e.code === 'KeyE') activateUltimate();
    if (e.code === 'KeyF' || e.code === 'KeyX') shootFrostShuriken();
    if (e.code === 'KeyI' || e.code === 'Tab') { e.preventDefault(); inventoryOpen = !inventoryOpen; }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// --- ПЛАВАЮЩИЙ СЕНСОРНЫЙ ДЖОЙСТИК (TOUCH JOYSTICK) ---
const touchJoystick = {
    active: false,
    startX: 0,
    startY: 0,
    x: 0,
    y: 0,
    touchId: null
};

const joyArea = document.getElementById('joystick-touch-area');
const joyBase = document.getElementById('joystick-base');
const joyStick = document.getElementById('joystick-stick');

function handleJoyStart(e) {
    e.preventDefault();
    initAudio();
    const touch = e.changedTouches[0];
    const rect = joyArea.getBoundingClientRect();
    
    touchJoystick.active = true;
    touchJoystick.touchId = touch.identifier;
    touchJoystick.startX = touch.clientX;
    touchJoystick.startY = touch.clientY;
    touchJoystick.x = 0;
    touchJoystick.y = 0;

    // Центрируем джойстик в точке касания
    joyStick.style.transform = `translate(0px, 0px)`;
}

function handleJoyMove(e) {
    e.preventDefault();
    if (!touchJoystick.active) return;

    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === touchJoystick.touchId) {
            const dx = touch.clientX - touchJoystick.startX;
            const dy = touch.clientY - touchJoystick.startY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = 40;

            let normX = dx / (dist || 1);
            let normY = dy / (dist || 1);
            let clamped = Math.min(dist, maxRadius);

            joyStick.style.transform = `translate(${normX * clamped}px, ${normY * clamped}px)`;

            if (dist > 6) {
                touchJoystick.x = normX * (clamped / maxRadius);
                touchJoystick.y = normY * (clamped / maxRadius);
            } else {
                touchJoystick.x = 0;
                touchJoystick.y = 0;
            }
            break;
        }
    }
}

function handleJoyEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchJoystick.touchId) {
            touchJoystick.active = false;
            touchJoystick.touchId = null;
            touchJoystick.x = 0;
            touchJoystick.y = 0;
            joyStick.style.transform = `translate(0px, 0px)`;
            break;
        }
    }
}

joyArea.addEventListener('touchstart', handleJoyStart, { passive: false });
joyArea.addEventListener('touchmove', handleJoyMove, { passive: false });
joyArea.addEventListener('touchend', handleJoyEnd, { passive: false });
joyArea.addEventListener('touchcancel', handleJoyEnd, { passive: false });

// --- ПРИВЯЗКА КНОПОК ДЕЙСТВИЙ ---
function bindTouch(id, onDown, onUp) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        initAudio();
        btn.classList.add('active');
        if (onDown) onDown();
    }, { passive: false });

    btn.addEventListener('touchend', e => {
        e.preventDefault();
        btn.classList.remove('active');
        if (onUp) onUp();
    }, { passive: false });

    btn.addEventListener('touchcancel', () => {
        btn.classList.remove('active');
        if (onUp) onUp();
    });
}

bindTouch('btn-atk', () => performMeleeAttack());
bindTouch('btn-def', () => raiseShield(), () => { player.isShielding = false; });
bindTouch('btn-ice', () => shootFrostShuriken());

function triggerDash() {
    if (!player.isSliding && player.sp >= 20 && !player.isShielding) {
        let sx = touchJoystick.active ? touchJoystick.x : 0;
        let sy = touchJoystick.active ? touchJoystick.y : 0;

        if (sx === 0 && sy === 0) {
            if (player.facing === 'up') sy = -1;
            if (player.facing === 'down') sy = 1;
            if (player.facing === 'left') sx = -1;
            if (player.facing === 'right') sx = 1;
        }

        const len = Math.hypot(sx, sy) || 1;
        player.isSliding = true;
        player.slideTimer = 18;
        player.slideDir = { x: sx / len, y: sy / len };
        player.sp -= 20;
        player.invul = 20;
        playSound('item');
    }
}

function shootFrostShuriken() {

        let vx = 0, vy = 0;

            vx = touchJoystick.x * 4.0;
            vy = touchJoystick.y * 4.0;
        } else {
            if (player.facing === 'right') vx = 4.0;
            if (player.facing === 'left') vx = -4.0;
            if (player.facing === 'up') vy = -4.0;
            if (player.facing === 'down') vy = 4.0;
        }

        playerShots.push({
            x: player.x + 8,
            y: player.y + 9,
            vx, vy,
            life: 75,
            type: 'frost_shuriken',
            rot: 0
        });

        addFloatingText(player.x - 4, player.y - 8, "ICE SHURIKEN!", '#38bdf8');
    }
}

// --- RENDER HELPERS ---
function drawShadow(x, y, w, h) {
    ctx.fillStyle = 'rgba(5, 7, 13, 0.45)';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h, w / 2.1, 3, 0, 0, Math.PI * 2);
    ctx.fill();
}

function draw16BitPortal(p) {
    const px = Math.round(p.x), py = Math.round(p.y);
    const progress = 1 - (p.timer / p.maxTimer);
    ctx.save();
    ctx.translate(px + 7, py + 7);
    ctx.rotate(Date.now() * 0.01);
    ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 8 * progress + 2, 4 * progress + 1, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#7c3aed'; ctx.beginPath(); ctx.arc(0, 0, 4 * progress + 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-1, -1, 2, 2);
    ctx.restore();
}

function draw16BitChest(c) {
    const cx = c.x, cy = c.y;
    drawShadow(cx, cy, 16, 14);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(cx, cy, 16, 14);
    if (c.opened) {
        ctx.fillStyle = '#78350f'; ctx.fillRect(cx + 1, cy + 5, 14, 8);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(cx + 2, cy + 2, 12, 4);
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(cx + 1, cy + 6, 14, 2);
    } else {
        ctx.fillStyle = '#92400e'; ctx.fillRect(cx + 1, cy + 1, 14, 12);
        ctx.fillStyle = '#b45309'; ctx.fillRect(cx + 2, cy + 2, 12, 10);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(cx + 2, cy + 1, 2, 12); ctx.fillRect(cx + 12, cy + 1, 2, 12); ctx.fillRect(cx + 7, cy + 6, 2, 3);
    }
}

function draw16BitPenguin(p) {
    const px = Math.round(p.x), py = Math.round(p.y);
    drawShadow(px, py, p.w, p.h);

    if (p.holdTimer > 0) {
        ctx.fillStyle = '#0b0f19'; ctx.fillRect(px + 2, py + 4, 12, 14);
        ctx.fillStyle = '#cbd5e1'; ctx.fillRect(px + 4, py + 8, 8, 9);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(px + 6, py + 8, 4, 3);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(px + 1, py + 2, 3, 6); ctx.fillRect(px + 12, py + 2, 3, 6);
        if (p.holdingItem === 'golden_fish') {
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(px + 3, py - 10, 10, 6);
            ctx.fillStyle = '#fff'; ctx.fillRect(px + 5, py - 9, 6, 2);
        } else if (p.holdingItem === 'armored_scarf') {
            ctx.fillStyle = '#94a3b8'; ctx.fillRect(px + 3, py - 8, 10, 4);
            ctx.fillStyle = '#475569'; ctx.fillRect(px + 6, py - 9, 4, 6);
        }
        return;
    }

    if (p.isSliding) {
        ctx.fillStyle = '#0b0f19'; ctx.fillRect(px, py + 6, 18, 10);
        ctx.fillStyle = '#cbd5e1'; ctx.fillRect(px + 2, py + 10, 14, 5);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(px + 2, py + 7, 14, 4);
        ctx.fillStyle = p.armor === 'armored_scarf' ? '#94a3b8' : '#e11d48';
        ctx.fillRect(px + (p.facing === 'left' ? 2 : 12), py + 6, 4, 3);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(px + (p.facing === 'left' ? -2 : 16), py + 8, 4, 3);
        return;
    }

    const bounce = p.walkFrame === 1 ? -1 : 0;
    ctx.fillStyle = '#0b0f19'; ctx.fillRect(px + 2, py + bounce, 12, 18);
    ctx.fillStyle = '#1e293b'; ctx.fillRect(px + 2, py + 1 + bounce, 12, 15);
    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(px + 4, py + 6 + bounce, 8, 9);
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(px + 5, py + 6 + bounce, 6, 7);

    if (p.armor === 'armored_scarf') {
        ctx.fillStyle = '#475569'; ctx.fillRect(px + 3, py + 5 + bounce, 10, 3);
        ctx.fillStyle = '#94a3b8'; ctx.fillRect(px + 4, py + 5 + bounce, 8, 2);
        ctx.fillStyle = '#f8fafc'; ctx.fillRect(px + 6, py + 5 + bounce, 2, 1);
    } else {
        ctx.fillStyle = '#9f1239'; ctx.fillRect(px + 3, py + 5 + bounce, 10, 3);
        ctx.fillStyle = '#e11d48'; ctx.fillRect(px + 4, py + 5 + bounce, 8, 2);
    }

    ctx.fillStyle = '#0f172a';
    if (p.facing === 'left') {
        ctx.fillRect(px + 3, py + 3 + bounce, 2, 3); ctx.fillStyle = '#fff'; ctx.fillRect(px + 3, py + 3 + bounce, 1, 1);
    } else if (p.facing === 'right') {
        ctx.fillRect(px + 11, py + 3 + bounce, 2, 3); ctx.fillStyle = '#fff'; ctx.fillRect(px + 12, py + 3 + bounce, 1, 1);
    } else {
        ctx.fillRect(px + 4, py + 3 + bounce, 2, 3); ctx.fillRect(px + 10, py + 3 + bounce, 2, 3);
        ctx.fillStyle = '#fff'; ctx.fillRect(px + 4, py + 3 + bounce, 1, 1); ctx.fillRect(px + 10, py + 3 + bounce, 1, 1);
    }

    ctx.fillStyle = '#d97706'; ctx.fillRect(px + 6, py + 5 + bounce, 4, 3);
    ctx.fillStyle = '#ea580c'; ctx.fillRect(px + 3, py + 16, 3, 2); ctx.fillRect(px + 10, py + 16, 3, 2);

    if (p.isShielding) {
        ctx.save();
        ctx.translate(px + 8, py + 9);
        let angle = 0;
        if (p.facing === 'right') angle = 0;
        if (p.facing === 'down') angle = Math.PI / 2;
        if (p.facing === 'left') angle = Math.PI;
        if (p.facing === 'up') angle = -Math.PI / 2;
        ctx.rotate(angle);
        ctx.fillStyle = p.parryWindow > 0 ? '#38bdf8' : '#0284c7'; ctx.fillRect(10, -7, 4, 14);
        ctx.fillStyle = '#e0f2fe'; ctx.fillRect(11, -5, 2, 10);
        ctx.fillStyle = '#0284c7'; ctx.fillRect(11, -1, 2, 2);
        if (p.parryWindow > 6) {
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(9, -8, 6, 16);
        }
        ctx.restore();
    }

    if (p.isAttacking) {
        ctx.save();
        ctx.translate(px + 8, py + 8);
        let angle = 0;
        if (p.facing === 'right') angle = 0;
        if (p.facing === 'down') angle = Math.PI / 2;
        if (p.facing === 'left') angle = Math.PI;
        if (p.facing === 'up') angle = -Math.PI / 2;
        ctx.rotate(angle);
        const isGold = p.weapon === 'golden_fish';
        ctx.strokeStyle = isGold ? 'rgba(251, 191, 36, 0.95)' : 'rgba(56, 189, 248, 0.9)';
        ctx.lineWidth = isGold ? 4 : 3;
        ctx.beginPath(); ctx.arc(4, 0, 19, -Math.PI / 3, Math.PI / 3); ctx.stroke();
        ctx.fillStyle = isGold ? '#d97706' : '#0284c7'; ctx.fillRect(10, -4, 12, 7);
        ctx.fillStyle = isGold ? '#fef08a' : '#38bdf8'; ctx.fillRect(12, -3, 8, 3);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(8, -2, 3, 3);
        ctx.restore();
    }
}

function draw16BitBoss(b) {
    const bx = Math.round(b.x), by = Math.round(b.y);
    drawShadow(bx, by, b.w, b.h);
    if (b.invul > 0 && b.invul % 4 > 2) return;

    ctx.fillStyle = b.isRage ? '#991b1b' : '#0f172a';
    ctx.fillRect(bx + 2, by, 24, 30); ctx.fillRect(bx, by + 4, 28, 24);
    ctx.fillStyle = b.isRage ? '#7f1d1d' : '#1e3a29';
    ctx.fillRect(bx + 4, by + 1, 20, 7);
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx + 11, by + 3, 6, 4);

    ctx.fillStyle = b.isRage ? '#fca5a5' : '#fbcfe8';
    ctx.fillRect(bx + 6, by + 10, 16, 9);
    ctx.fillStyle = '#111'; ctx.fillRect(bx + 8, by + 12, 3, 2); ctx.fillRect(bx + 17, by + 12, 3, 2);
    ctx.fillStyle = '#881337'; ctx.fillRect(bx + 12, by + 16, 4, 1);

    ctx.fillStyle = b.isRage ? '#991b1b' : '#14532d';
    ctx.fillRect(bx + 4, by + 19, 20, 11);
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx + 2, by + 19, 4, 4); ctx.fillRect(bx + 22, by + 19, 4, 4);

    ctx.fillStyle = '#0f172a'; ctx.fillRect(bx + 5, by + 23, 18, 9);
    ctx.fillStyle = '#1e293b'; ctx.fillRect(bx + 6, by + 24, 16, 7);
    ctx.fillStyle = b.isRage ? '#ef4444' : '#22c55e'; ctx.fillRect(bx + 13, by + 24, 3, 3);
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(bx + 18, by + 25, 2, 2);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(bx + 20, by + 25, 2, 2);
    ctx.fillStyle = '#22c55e'; ctx.fillRect(bx + 19, by + 27, 2, 2);
    ctx.fillStyle = '#eab308'; ctx.fillRect(bx + 19, by + 23, 2, 2);

    if (b.state === 'OVERHEAT') {
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(bx + 24, by - 4, 3, 4);
        ctx.fillStyle = '#fff'; ctx.fillRect(bx + 24, by - 3, 1, 1);
        if (Math.floor(Date.now() / 200) % 2 === 0) {
            ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 7px monospace'; ctx.fillText("БЕЙ!", bx + 6, by - 6);
        }
    }
}

function draw16BitMinion(m) {
    const mx = Math.round(m.x), my = Math.round(m.y);
    drawShadow(mx, my, 14, 14);
    if (m.invul > 0 && m.invul % 4 > 2) return;

    ctx.fillStyle = '#1e1b4b'; ctx.fillRect(mx + 1, my, 12, 14);
    ctx.fillStyle = '#7c3aed'; ctx.fillRect(mx + 2, my + 2, 10, 10);
    ctx.fillStyle = '#09090b'; ctx.fillRect(mx + 2, my + 5, 10, 3);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(mx + 3, my + 5, 2, 1); ctx.fillRect(mx + 8, my + 5, 2, 1);

    if (m.freezeTimer > 0) {
        ctx.fillStyle = 'rgba(165, 243, 252, 0.65)';
        ctx.fillRect(mx - 2, my - 2, 18, 18);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1;
        ctx.strokeRect(mx - 2, my - 2, 18, 18);
        ctx.fillStyle = '#fff';
        ctx.fillRect(mx, my, 4, 2);
    }
}

// --- UPDATE LOOP ---
function update() {
    if (transition.active) {
        if (transition.state === 'in') {
            transition.alpha += 0.08;
            if (transition.alpha >= 1) {
                transition.alpha = 1;
                transition.state = 'out';
                currentRoom = transition.targetRoom;

                if (currentRoom === 'THRONE') {
                    player.x = 152; player.y = 190; player.facing = 'up';
                    boss.active = true; throneDoorLocked = true;
                    minions = []; spawnPortals = []; spawnTimer = 60;
                    playSound('door_slam');
                    dialog = {
                        speaker: "ГЕНЕРАЛ 1:6",
                        text: "ТЫ ПОСМЕЛ ВОЙТИ В МОЙ ТРОННЫЙ ЗАЛ?! БАМБОЧИ, УНИЧТОЖИТЬ ЕГО!",
                        timer: 280, portrait: 'boss'
                    };
                }
            }
        } else {
            transition.alpha -= 0.08;
            if (transition.alpha <= 0) {
                transition.alpha = 0;
                transition.active = false;
            }
        }
        return;
    }

    if (inventoryOpen) return;
    if (dialog.timer > 0) dialog.timer--;
    if (screenShake > 0) screenShake *= 0.86;

    torchTimer++;
    if (torchTimer > 6) { torchFrame = (torchFrame + 1) % 3; torchTimer = 0; }

    if (keys['Enter']) dialog.timer = 0;
    if (player.hp <= 0) { gameState = 'GAMEOVER'; return; }

    if (player.invul > 0) player.invul--;
    if (player.holdTimer > 0) { player.holdTimer--; return; }

    const aliveBambochi = minions.filter(m => m.hp > 0).length;
    const maxAllowed = (currentRoom === 'THRONE') ? MAX_BAMBOCHI_THRONE : MAX_BAMBOCHI_CATACOMBS;

    if (aliveBambochi < maxAllowed && spawnPortals.length === 0) {
        spawnTimer--;
        if (spawnTimer <= 0) {
            spawnTimer = (currentRoom === 'THRONE') ? 180 : 220;
            if (currentRoom === 'THRONE') {
                const sideX = Math.random() > 0.5 ? Math.floor(Math.random() * 50 + 40) : Math.floor(Math.random() * 50 + 230);
                const sideY = Math.floor(Math.random() * 80 + 70);
                spawnBambochPortal(sideX, sideY);
            } else {
                spawnBambochPortal();
            }
        }
    }

    if (currentRoom === 'CATACOMBS') {
        if (player.y <= 30 && player.x >= 135 && player.x <= 170) {
            if (gateOpened) {
                startRoomTransition('THRONE');
                return;
            } else {
                if (dialog.timer === 0) {
                    dialog = {
                        speaker: "ВОРОТА ТРОНА",
                        text: `Заперто на 3 печати! Собрано свитков: ${player.schedules}/3`,
                        timer: 120, portrait: 'penguin'
                    };
                }
            }
        }
    }

    for (let i = spawnPortals.length - 1; i >= 0; i--) {
        const portal = spawnPortals[i];
        portal.timer--;
        if (Math.random() < 0.3) {
            particles.push({
                x: portal.x + 7 + (Math.random() - 0.5) * 8,
                y: portal.y + 7 + (Math.random() - 0.5) * 8,
                vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5,
                life: 12, color: '#c084fc'
            });
        }
        if (portal.timer <= 0) {
            minions.push({
                x: portal.x, y: portal.y, hp: 3, maxHp: 3,
                speed: 0.65, dirX: (Math.random() > 0.5 ? 1 : -1), dirY: 0,
                timer: 30, invul: 0, freezeTimer: 0, name: 'Бамбоч'
            });
            spawnSparks(portal.x + 7, portal.y + 7, '#7c3aed', 15);
            addFloatingText(portal.x, portal.y - 6, "БАМБОЧ!", '#c084fc');
            spawnPortals.splice(i, 1);
        }
    }

    if (player.sp < player.maxSp && !player.isShielding) player.sp += 0.5;

    if (player.isShielding) {
        player.sp = Math.max(0, player.sp - 0.2);
        if (player.parryWindow > 0) player.parryWindow--;
        if (player.sp <= 0) {
            player.isShielding = false;
            playSound('block');
        }
    }

    if ((keys['ShiftLeft'] || keys['ShiftRight']) && !player.isSliding && player.sp >= 20 && !player.isShielding) {
        triggerDash();
    }

    if (player.isSliding) {
        player.slideTimer--;
        player.x += player.slideDir.x * 3.6;
        player.y += player.slideDir.y * 3.6;
        spawnSparks(player.x + 8, player.y + 12, '#a5f3fc', 2);
        if (player.slideTimer <= 0) player.isSliding = false;
    } else {
        let dx = 0, dy = 0;
        if (keys['KeyW'] || keys['ArrowUp'])    { dy = -1; player.facing = 'up'; }
        if (keys['KeyS'] || keys['ArrowDown'])  { dy = 1;  player.facing = 'down'; }
        if (keys['KeyA'] || keys['ArrowLeft'])  { dx = -1; player.facing = 'left'; }
        if (keys['KeyD'] || keys['ArrowRight']) { dx = 1;  player.facing = 'right'; }

        // Сенсорный джойстик
        if (touchJoystick.active && (touchJoystick.x !== 0 || touchJoystick.y !== 0)) {
            dx = touchJoystick.x;
            dy = touchJoystick.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                player.facing = dx > 0 ? 'right' : 'left';
            } else {
                player.facing = dy > 0 ? 'down' : 'up';
            }
        }

        if (dx !== 0 || dy !== 0) {
            player.walkTimer++;
            if (player.walkTimer > 7) { player.walkFrame = (player.walkFrame + 1) % 2; player.walkTimer = 0; }
            if (!touchJoystick.active && dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
            const currentSpeed = player.isShielding ? player.speed * 0.5 : player.speed;
            player.x += dx * currentSpeed;
            player.y += dy * currentSpeed;
        } else {
            player.walkFrame = 0;
        }
    }

    player.x = Math.max(18, Math.min(320 - player.w - 18, player.x));
    player.y = Math.max(26, Math.min(224 - player.h - 30, player.y));

    if (player.attackTimer > 0) {
        player.attackTimer--;
        if (player.attackTimer <= 6) player.isAttacking = false;
    }

    let slashBox = null;
    if (player.isAttacking || player.isSliding) {
        const dist = player.isSliding ? 20 : 18;
        if (player.facing === 'right') slashBox = { x: player.x + 8, y: player.y - 6, w: dist, h: player.h + 12 };
        if (player.facing === 'left')  slashBox = { x: player.x - dist + 4, y: player.y - 6, w: dist, h: player.h + 12 };
        if (player.facing === 'up')    slashBox = { x: player.x - 6, y: player.y - dist + 4, w: player.w + 12, h: dist };
        if (player.facing === 'down')  slashBox = { x: player.x - 6, y: player.y + 8, w: player.w + 12, h: dist };
    }

    if (currentRoom === 'CATACOMBS') {
        chests.forEach(c => {
            if (!c.opened && slashBox) {
                if (slashBox.x < c.x + 16 && slashBox.x + slashBox.w > c.x &&
                    slashBox.y < c.y + 14 && slashBox.y + slashBox.h > c.y) {
                    c.opened = true;
                    player.holdingItem = c.item;
                    player.holdTimer = 60;
                    playSound('fanfare');
                    spawnSparks(c.x + 8, c.y + 7, '#fbbf24', 20);

                    if (c.item === 'golden_fish') {
                        player.hasGoldenFish = true;
                        player.weapon = 'golden_fish';
                        dialog = {
                            speaker: "НАХОДКА!",
                            text: "Получена ЗОЛОТАЯ РЫБА! Двойной урон и волны при полном HP!",
                            timer: 300, portrait: 'penguin'
                        };
                    } else if (c.item === 'armored_scarf') {
                        player.hasArmoredScarf = true;
                        player.armor = 'armored_scarf';
                        player.maxHp = 8;
                        player.hp = player.maxHp;
                        dialog = {
                            speaker: "НАХОДКА!",
                            text: "Экипирован БРОНИРОВАННЫЙ ШАРФ! +2 Макс. HP и защита от урона!",
                            timer: 300, portrait: 'penguin'
                        };
                    }
                }
            }
        });

        scrolls.forEach((s) => {
            if (!s.collected && Math.hypot(player.x + 8 - (s.x + 6), player.y + 9 - (s.y + 5)) < 16) {
                s.collected = true;
                player.schedules++;
                addHype(35);
                playSound('item');
                spawnSparks(s.x + 6, s.y + 5, '#fde68a', 14);

                if (player.schedules === 1) {
                    dialog = { speaker: "РАСПИСАНИЕ 1/3", text: "'...Вторник: Фаворит запускает стрим в 19:00...'", timer: 240, portrait: 'penguin' };
                } else if (player.schedules === 2) {
                    dialog = { speaker: "РАСПИСАНИЕ 2/3", text: "'...Пятница: Кооп-битва с генералами...'", timer: 240, portrait: 'penguin' };
                } else if (player.schedules === 3) {
                    gateOpened = true;
                    screenShake = 14;
                    playSound('door_unlock');
                    dialog = {
                        speaker: "ВРАТА ОТКРЫТЫ!",
                        text: "Все 3 свитка собраны! Северные ворота в Тронный Зал распахнулись!",
                        timer: 320, portrait: 'penguin'
                    };
                }
            }
        });
    }

    for (let i = playerShots.length - 1; i >= 0; i--) {
        const ps = playerShots[i];
        ps.x += ps.vx; ps.y += ps.vy;
        ps.life--; ps.rot += 0.25;

        minions.forEach(m => {
            if (m.hp > 0 && Math.hypot(ps.x - (m.x + 7), ps.y - (m.y + 7)) < 12) {
                const dmg = (ps.type === 'golden_wave') ? 3 : 2;
                m.hp -= dmg; m.invul = 15;

                if (ps.type === 'frost_shuriken') {
                    m.freezeTimer = 90;
                    playSound('freeze');
                    spawnSparks(m.x + 7, m.y + 7, '#a5f3fc', 12);
                    addFloatingText(m.x, m.y - 4, `FROZEN! -${dmg}`, '#38bdf8');
                } else {
                    playSound('hit');
                    spawnSparks(m.x + 7, m.y + 7, '#fbbf24', 10);
                    addFloatingText(m.x, m.y - 4, `-${dmg}`, '#fbbf24');
                }

                addHype(12);
                ps.life = 0;
            }
        });

        if (currentRoom === 'THRONE' && boss.active && boss.hp > 0 && boss.invul === 0) {
            if (ps.x > boss.x && ps.x < boss.x + boss.w && ps.y > boss.y && ps.y < boss.y + boss.h) {
                const dmg = (ps.type === 'golden_wave') ? 3 : 2;
                boss.hp -= dmg; boss.invul = 15; boss.hitStun = 10;
                addHype(15);
                playSound(ps.type === 'frost_shuriken' ? 'freeze' : 'hit');
                spawnSparks(boss.x + 14, boss.y + 16, '#38bdf8', 12);
                addFloatingText(boss.x + 8, boss.y - 6, `RANGED -${dmg}!`, '#38bdf8');
                ps.life = 0;
            }
        }

        if (ps.life <= 0 || ps.x < 10 || ps.x > 310 || ps.y < 20 || ps.y > 210) {
            playerShots.splice(i, 1);
        }
    }

    for (let i = ultProjectiles.length - 1; i >= 0; i--) {
        const up = ultProjectiles[i];
        up.y += up.vy; up.life--;

        if (up.y > 40) {
            if (Math.random() < 0.2) playSound('coin');

            minions.forEach(m => {
                if (m.hp > 0 && Math.hypot(up.x - (m.x + 7), up.y - (m.y + 7)) < 16) {
                    m.hp -= 2; m.invul = 15;
                    spawnSparks(m.x + 7, m.y + 7, '#fbbf24', 6);
                }
            });

            if (currentRoom === 'THRONE' && boss.active && boss.hp > 0 && boss.invul === 0) {
                if (up.x > boss.x && up.x < boss.x + boss.w && up.y > boss.y && up.y < boss.y + boss.h) {
                    const ultDmg = up.type === 'giant_fish' ? 6 : 2;
                    boss.hp -= ultDmg; boss.invul = 15; boss.hitStun = 15;
                    screenShake = 10; playSound('hit');
                    spawnSparks(boss.x + 14, boss.y + 16, '#f43f5e', 14);
                    addFloatingText(boss.x + 8, boss.y - 6, `ULT -${ultDmg}!`, '#f43f5e');
                }
            }
        }

        if (up.y > 220 || up.life <= 0) {
            ultProjectiles.splice(i, 1);
        }
    }

    const baseDamage = (player.weapon === 'golden_fish') ? 2 : 1;

    minions.forEach(m => {
        if (m.hp <= 0) return;
        if (m.invul > 0) m.invul--;

        if (m.freezeTimer > 0) {
            m.freezeTimer--;
            return;
        }

        m.timer--;
        if (m.timer <= 0) {
            m.timer = 50 + Math.random() * 30;
            const angle = Math.atan2(player.y - m.y, player.x - m.x);
            m.dirX = Math.cos(angle); m.dirY = Math.sin(angle);
        }
        m.x += m.dirX * m.speed; m.y += m.dirY * m.speed;

        if (player.invul === 0 && Math.hypot(player.x + 8 - (m.x + 7), player.y + 9 - (m.y + 7)) < 12) {
            if (player.isShielding) {
                playSound('block'); player.sp -= 15;
                m.x -= m.dirX * 16; m.y -= m.dirY * 16;
                spawnSparks(player.x + 8, player.y + 9, '#38bdf8', 6);
                addFloatingText(player.x, player.y - 6, "BLOCKED!", '#38bdf8');
            } else {
                player.hp--; player.invul = player.armor === 'armored_scarf' ? 60 : 45;
                screenShake = 6; playSound('hit');
                addFloatingText(player.x, player.y - 6, "-1 HP", '#ef4444');
            }
        }

        if (slashBox && m.invul === 0) {
            if (slashBox.x < m.x + 14 && slashBox.x + slashBox.w > m.x &&
                slashBox.y < m.y + 14 && slashBox.y + slashBox.h > m.y) {
                m.hp -= baseDamage; m.invul = 15; addHype(12);
                playSound('hit'); spawnSparks(m.x + 7, m.y + 7, '#fbbf24', 10);
                addFloatingText(m.x, m.y - 4, `БАМБОЧ -${baseDamage}`, '#fbbf24');
                m.x -= m.dirX * 14; m.y -= m.dirY * 14;
            }
        }
    });

    if (currentRoom === 'THRONE' && boss.active && boss.hp > 0) {
        if (boss.invul > 0) boss.invul--;

        if (boss.hp <= boss.maxHp / 2 && !boss.isRage) {
            boss.isRage = true; boss.baseSpeed = 1.0;
            screenShake = 15; playSound('door_slam');
            spawnBambochPortal(60, 100); spawnBambochPortal(240, 100);
            dialog = {
                speaker: "ГЕНЕРАЛ 1:6",
                text: "БАМБОЧИ, НА ПОМОЩЬ! КРАСНОЕ КОЛЬЦО СМЕРТИ АКТИВИРОВАНО!",
                timer: 220, portrait: 'boss'
            };
        }

        if (boss.hitStun > 0) {
            boss.hitStun--;
        } else {
            if (boss.state === 'PATROL') {
                boss.x += boss.baseSpeed * boss.dir;
                if (boss.x > 260) boss.dir = -1;
                if (boss.x < 32)  boss.dir = 1;
                boss.shootTimer--;
                if (boss.shootTimer <= 0) boss.state = 'SHOOT';
            } else if (boss.state === 'SHOOT') {
                const btnTypes = [
                    { char: 'A', color: '#22c55e' }, { char: 'B', color: '#ef4444' },
                    { char: 'X', color: '#38bdf8' }, { char: 'Y', color: '#eab308' }
                ];
                const btn = btnTypes[Math.floor(Math.random() * btnTypes.length)];
                const angle = Math.atan2(player.y + 9 - (boss.y + 24), player.x + 8 - (boss.x + 14));

                projectiles.push({
                    x: boss.x + 14, y: boss.y + 24,
                    vx: Math.cos(angle) * 2.2, vy: Math.sin(angle) * 2.2,
                    btn: btn.char, color: btn.color, life: 140, reflected: false
                });

                boss.state = 'OVERHEAT';
                boss.overheatTimer = boss.isRage ? 45 : 75;
            } else if (boss.state === 'OVERHEAT') {
                boss.overheatTimer--;
                if (boss.overheatTimer <= 0) {
                    boss.state = 'PATROL';
                    boss.shootTimer = boss.isRage ? 40 : 65;
                }
            }
        }

        if (slashBox && boss.invul === 0) {
            if (slashBox.x < boss.x + boss.w && slashBox.x + slashBox.w > boss.x &&
                slashBox.y < boss.y + boss.h && slashBox.y + slashBox.h > boss.y) {
                const totalDmg = player.isSliding ? (baseDamage + 2) : baseDamage;
                boss.hp -= totalDmg; boss.invul = 20; boss.hitStun = 12;
                addHype(18); screenShake = 8; playSound('hit');
                addFloatingText(boss.x + 8, boss.y - 6, `-${totalDmg} CRIT!`, '#fbbf24');
                spawnSparks(boss.x + 14, boss.y + 16, '#fbbf24', 12);

                if (boss.hp <= 0) {
                    gameState = 'VICTORY'; screenShake = 22;
                    spawnSparks(boss.x + 14, boss.y + 16, '#fbbf24', 50);
                    dialog = {
                        speaker: "ГЕНЕРАЛ 1:6",
                        text: "НЕЕЕТ! Мой геймпад сломан... Стрим Фаворита СЕГОДНЯ В 19:00!",
                        timer: 450, portrait: 'boss'
                    };
                }
            }
        }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.x += pr.vx; pr.y += pr.vy; pr.life--;

        if (pr.reflected) {
            if (currentRoom === 'THRONE' && boss.active && boss.hp > 0 && boss.invul === 0) {
                if (Math.hypot(pr.x - (boss.x + 14), pr.y - (boss.y + 16)) < 16) {
                    boss.hp -= 3; boss.invul = 20; boss.hitStun = 25;
                    screenShake = 12; playSound('hit');
                    spawnSparks(boss.x + 14, boss.y + 16, '#38bdf8', 16);
                    addFloatingText(boss.x + 8, boss.y - 6, "PARRY COUNTER -3!", '#38bdf8');
                    projectiles.splice(i, 1);
                    continue;
                }
            }
        } else {
            if (player.invul === 0 && Math.hypot(player.x + 8 - pr.x, player.y + 9 - pr.y) < 12) {
                if (player.isShielding && player.parryWindow > 0) {
                    pr.reflected = true;
                    pr.vx = -pr.vx * 1.6; pr.vy = -pr.vy * 1.6;
                    pr.color = '#38bdf8'; pr.life = 100;
                    playSound('parry'); screenShake = 10; addHype(30);
                    spawnSparks(player.x + 8, player.y + 9, '#38bdf8', 16);
                    addFloatingText(player.x - 4, player.y - 12, "PERFECT PARRY!", '#38bdf8');
                    continue;
                } else if (player.isShielding) {
                    player.sp -= 15; playSound('block');
                    spawnSparks(player.x + 8, player.y + 9, '#0284c7', 8);
                    addFloatingText(player.x, player.y - 6, "BLOCKED", '#0284c7');
                    projectiles.splice(i, 1);
                    continue;
                } else {
                    player.hp--; player.invul = player.armor === 'armored_scarf' ? 60 : 45;
                    screenShake = 7; playSound('hit');
                    addFloatingText(player.x, player.y - 6, "-1 HP", pr.color);
                    projectiles.splice(i, 1);
                    continue;
                }
            }
        }

        if (pr.life <= 0 || pr.x < 0 || pr.x > 320 || pr.y < 0 || pr.y > 224) {
            projectiles.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy; ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

// --- RENDER (ЧЁТКИЙ ДВУХСЛОЙНЫЙ ВЫВОД) ---
function draw() {
    ctx.save();

    // СЛОЙ 1: ПИКСЕЛЬНЫЙ МИР (640x448 -> scale 2x)
    ctx.save();
    ctx.scale(2, 2);

    if (screenShake > 0.5) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    }

    if (currentRoom === 'CATACOMBS') {
        ctx.fillStyle = '#0a0d16'; ctx.fillRect(0, 0, 320, 224);
        for (let y = 24; y < 196; y += 24) {
            for (let x = 16; x < 304; x += 24) {
                ctx.fillStyle = '#161b29'; ctx.fillRect(x, y, 23, 23);
                ctx.fillStyle = '#262f45'; ctx.fillRect(x, y, 23, 1); ctx.fillRect(x, y, 1, 23);
            }
        }

        ctx.fillStyle = '#06080e';
        ctx.fillRect(0, 0, 320, 24); ctx.fillRect(0, 196, 320, 28);
        ctx.fillRect(0, 0, 16, 224); ctx.fillRect(304, 0, 16, 224);
        ctx.strokeStyle = '#334155'; ctx.strokeRect(15, 23, 290, 174);

        if (gateOpened) {
            ctx.fillStyle = '#020617'; ctx.fillRect(136, 4, 48, 20);
            ctx.strokeStyle = '#38bdf8'; ctx.strokeRect(136, 4, 48, 20);
        } else {
            ctx.fillStyle = '#1e293b'; ctx.fillRect(136, 4, 48, 20);
            ctx.strokeStyle = '#475569'; ctx.strokeRect(136, 4, 48, 20);
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = (player.schedules > i) ? '#38bdf8' : '#64748b';
                ctx.fillRect(144 + i * 12, 10, 6, 8);
            }
        }

        catacombsTorches.forEach(t => {
            ctx.fillStyle = '#475569'; ctx.fillRect(t.x + 2, t.y + 4, 4, 6);
            const colors = ['#f59e0b', '#ef4444', '#fef08a'];
            ctx.fillStyle = colors[torchFrame % colors.length];
            ctx.fillRect(t.x + 1, t.y - 1, 6, 6);
        });

        chests.forEach(draw16BitChest);

        scrolls.forEach(s => {
            if (s.collected) return;
            const sy = s.y + Math.sin(Date.now() * 0.005 + s.x) * 2;
            drawShadow(s.x, sy + 3, 12, 10);
            ctx.fillStyle = '#78350f'; ctx.fillRect(s.x, sy, 12, 11);
            ctx.fillStyle = '#fef3c7'; ctx.fillRect(s.x + 1, sy + 1, 10, 9);
            ctx.fillStyle = '#b45309'; ctx.fillRect(s.x + 3, sy + 3, 6, 1);
        });

        spawnPortals.forEach(draw16BitPortal);
        minions.forEach(m => { if (m.hp > 0) draw16BitMinion(m); });
    }

    if (currentRoom === 'THRONE') {
        ctx.fillStyle = '#140810'; ctx.fillRect(0, 0, 320, 224);
        for (let y = 24; y < 196; y += 24) {
            for (let x = 16; x < 304; x += 24) {
                ctx.fillStyle = '#24101e'; ctx.fillRect(x, y, 23, 23);
                ctx.fillStyle = '#4a1d37'; ctx.fillRect(x, y, 23, 1); ctx.fillRect(x, y, 1, 23);
            }
        }

        ctx.fillStyle = '#881337'; ctx.fillRect(130, 24, 60, 172);
        ctx.fillStyle = '#be123c'; ctx.fillRect(134, 24, 52, 172);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(130, 24, 2, 172); ctx.fillRect(188, 24, 2, 172);

        ctx.fillStyle = '#0f172a'; ctx.fillRect(136, 10, 48, 26);
        ctx.fillStyle = '#1e3a29'; ctx.fillRect(140, 12, 40, 22);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(148, 14, 24, 4);

        ctx.fillStyle = '#107c10';
        ctx.fillRect(36, 26, 16, 32); ctx.fillRect(268, 26, 16, 32);

        ctx.fillStyle = '#050204';
        ctx.fillRect(0, 0, 320, 24); ctx.fillRect(0, 196, 320, 28);
        ctx.fillRect(0, 0, 16, 224); ctx.fillRect(304, 0, 16, 224);
        ctx.strokeStyle = '#991b1b'; ctx.strokeRect(15, 23, 290, 174);

        ctx.fillStyle = '#1e293b'; ctx.fillRect(136, 196, 48, 16);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(158, 202, 4, 4);

        throneTorches.forEach(t => {
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(t.x + 2, t.y + 4, 4, 6);
            const colors = ['#f59e0b', '#ef4444', '#fef08a'];
            ctx.fillStyle = colors[torchFrame % colors.length];
            ctx.fillRect(t.x + 1, t.y - 1, 6, 6);
        });

        if (boss.active && boss.hp > 0) {
            draw16BitBoss(boss);
            ctx.fillStyle = '#000'; ctx.fillRect(80, 8, 160, 9);
            ctx.fillStyle = boss.isRage ? '#dc2626' : '#991b1b';
            ctx.fillRect(81, 9, (boss.hp / boss.maxHp) * 158, 7);
            ctx.strokeStyle = '#f59e0b'; ctx.strokeRect(80, 8, 160, 9);
        }

        spawnPortals.forEach(draw16BitPortal);
        minions.forEach(m => { if (m.hp > 0) draw16BitMinion(m); });
    }

    ultProjectiles.forEach(up => {
        if (up.type === 'giant_fish') {
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(up.x - 10, up.y - 6, 20, 12);
            ctx.fillStyle = '#fff'; ctx.fillRect(up.x - 4, up.y - 4, 8, 4);
        } else {
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(up.x - 3, up.y - 3, 6, 6);
            ctx.fillStyle = '#fef08a'; ctx.fillRect(up.x - 1, up.y - 1, 2, 2);
        }
    });

    playerShots.forEach(ps => {
        if (ps.type === 'frost_shuriken') {
            ctx.save();
            ctx.translate(ps.x, ps.y);
            ctx.rotate(ps.rot);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-4, -1, 8, 2); ctx.fillRect(-1, -4, 2, 8);
            ctx.fillStyle = '#fff'; ctx.fillRect(-1, -1, 2, 2);
            ctx.restore();
        } else {
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath(); ctx.arc(ps.x, ps.y, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.fillRect(ps.x - 1, ps.y - 1, 2, 2);
        }
    });

    projectiles.forEach(pr => {
        ctx.fillStyle = pr.color;
        ctx.beginPath(); ctx.arc(pr.x, pr.y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 6px monospace';
        ctx.fillText(pr.reflected ? "★" : pr.btn, pr.x - 2, pr.y + 2);
    });

    particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 2, 2); });

    if (player.hp > 0 && !(player.invul > 0 && player.invul % 4 > 2)) {
        draw16BitPenguin(player);
    }

    ctx.restore(); // Конец пиксельного слоя

    // ==========================================
    // СЛОЙ 2: ЧЁТКИЙ UI, ТЕКСТ И ДИАЛОГИ (640x448)
    // ==========================================

    if (currentRoom === 'THRONE' && boss.active && boss.hp > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(boss.isRage ? "ГЕНЕРАЛ 1:6 [RAGE MODE - RROD]" : "ГЕНЕРАЛ 1:6 (КОЛЯНЧИК)", 320, 14);
        ctx.textAlign = 'left';
    }

    if (currentRoom === 'CATACOMBS' && gateOpened) {
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 12px monospace';
        ctx.fillText("▲ ВХОД В ТРОННЫЙ ЗАЛ ▲", 240, 36);
    }

    floatingTexts.forEach(ft => {
        ctx.font = 'bold 14px monospace';
        ctx.fillStyle = '#000';
        ctx.fillText(ft.text, ft.x * 2 + 1, ft.y * 2 + 1);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x * 2, ft.y * 2);
    });

    // Сердечки
    for (let i = 0; i < player.maxHp / 2; i++) {
        const hVal = player.hp - i * 2;
        const hx = 40 + i * 22;
        ctx.fillStyle = '#0f172a'; ctx.fillRect(hx, 12, 18, 16);
        if (hVal >= 2) {
            ctx.fillStyle = '#ef4444'; ctx.fillRect(hx + 2, 14, 14, 12);
            ctx.fillStyle = '#fca5a5'; ctx.fillRect(hx + 4, 16, 4, 4);
        } else if (hVal === 1) {
            ctx.fillStyle = '#ef4444'; ctx.fillRect(hx + 2, 14, 7, 12);
        }
    }

    // Шкала Хайпа
    const isHypeMax = player.hype === player.maxHype;
    ctx.fillStyle = '#0f172a'; ctx.fillRect(40, 34, 100, 10);
    ctx.fillStyle = isHypeMax ? ((Math.floor(Date.now() / 150) % 2 === 0) ? '#fbbf24' : '#f43f5e') : '#a855f7';
    ctx.fillRect(40, 34, (player.hype / player.maxHype) * 100, 10);
    ctx.strokeStyle = '#475569'; ctx.strokeRect(40, 34, 100, 10);

    if (isHypeMax) {
        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 11px monospace';
        ctx.fillText("ULT READY!", 148, 43);
    }

    ctx.fillStyle = '#0f172a'; ctx.fillRect(460, 12, 70, 24);
    ctx.strokeStyle = '#475569'; ctx.strokeRect(460, 12, 70, 24);
    ctx.fillStyle = player.weapon === 'golden_fish' ? '#fbbf24' : '#38bdf8';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(player.weapon === 'golden_fish' ? "ЗОЛОТО" : "МЕЧ", 474, 28);

    ctx.fillStyle = '#fde68a'; ctx.font = 'bold 13px monospace';
    ctx.fillText(`СВИТКИ: ${player.schedules}/${player.totalSchedules}`, 540, 28);

    // Диалоговое окно
    if (dialog.timer > 0) {
        const dy = 320;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.97)';
        ctx.fillRect(32, dy, 576, 104);
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
        ctx.strokeRect(32, dy, 576, 104);

        ctx.fillStyle = '#0f172a'; ctx.fillRect(44, dy + 12, 64, 64);
        ctx.strokeStyle = '#64748b'; ctx.strokeRect(44, dy + 12, 64, 64);

        if (dialog.portrait === 'penguin') {
            ctx.fillStyle = '#1e293b'; ctx.fillRect(52, dy + 20, 48, 48);
            ctx.fillStyle = '#cbd5e1'; ctx.fillRect(60, dy + 40, 32, 28);
            ctx.fillStyle = player.armor === 'armored_scarf' ? '#94a3b8' : '#e11d48';
            ctx.fillRect(56, dy + 36, 40, 8);
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(68, dy + 40, 16, 10);
            ctx.fillStyle = '#000'; ctx.fillRect(60, dy + 28, 8, 8); ctx.fillRect(84, dy + 28, 8, 8);
        } else {
            ctx.fillStyle = '#1e3a29'; ctx.fillRect(52, dy + 20, 48, 20);
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(70, dy + 24, 12, 8);
            ctx.fillStyle = '#fbcfe8'; ctx.fillRect(56, dy + 40, 40, 28);
        }

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 15px monospace';
        ctx.fillText(dialog.speaker, 124, dy + 26);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '13px monospace';
        const words = dialog.text.split(' ');
        let line = '', lineY = dy + 50;
        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            if (testLine.length > 46) {
                ctx.fillText(line, 124, lineY);
                line = words[n] + ' ';
                lineY += 18;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, 124, lineY);
    }

    if (inventoryOpen) {
        ctx.fillStyle = 'rgba(11, 15, 25, 0.96)';
        ctx.fillRect(60, 50, 520, 348);
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
        ctx.strokeRect(60, 50, 520, 348);

        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 18px monospace';
        ctx.fillText("=== МЕНЮ ЭКИПИРОВКИ ===", 190, 85);

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 14px monospace';
        ctx.fillText("[ОРУЖИЕ] (ПКМ / ⚔️):", 90, 130);
        ctx.fillStyle = '#fff'; ctx.font = '13px monospace';
        if (player.hasGoldenFish) {
            ctx.fillText(player.weapon === 'golden_fish' ? "► ЗОЛОТАЯ РЫБА (Урон: x2 + Волна)" : "  Синяя рыба-меч (Урон: 1)", 90, 155);
        } else {
            ctx.fillText("► Синяя рыба-меч (Урон: 1)", 90, 155);
            ctx.fillStyle = '#64748b'; ctx.fillText("  [?] Найдите золотой сундук!", 90, 175);
        }

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 14px monospace';
        ctx.fillText("[ДАЛЬНЯЯ МАГИЯ] (СКМ / ❄️):", 90, 215);
        ctx.fillStyle = '#fff'; ctx.font = '13px monospace';
        ctx.fillText("► Морозный Сюрикен (Заморозка врагов 1.5с 🧊)", 90, 240);

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 14px monospace';
        ctx.fillText("[БРОНЯ] (ЛКМ / 🛡️):", 90, 280);
        ctx.fillStyle = '#fff'; ctx.font = '13px monospace';
        if (player.hasArmoredScarf) {
            ctx.fillText("► Бронированный стальной шарф (+2 HP & Защита)", 90, 305);
        } else {
            ctx.fillText("► Обычный красный шарф", 90, 305);
        }

        ctx.fillStyle = '#9ca3af'; ctx.font = '12px monospace';
        ctx.fillText("Нажмите [ИНВЕНТАРЬ] или [TAB], чтобы закрыть", 170, 370);
    }

    if (transition.active) {
        ctx.fillStyle = `rgba(0, 0, 0, ${transition.alpha})`;
        ctx.fillRect(0, 0, 640, 448);
    }

    if (gameState === 'VICTORY') {
        ctx.fillStyle = 'rgba(10, 15, 26, 0.92)';
        ctx.fillRect(0, 0, 640, 448);
        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("★ ПОБЕДА! РАСПИСАНИЕ НАЙДЕНО ★", 320, 180);
        ctx.fillStyle = '#4ade80'; ctx.font = '15px monospace';
        ctx.fillText("Стрим Фаворита: СЕГОДНЯ В 19:00 ПО МСК!", 320, 230);
        ctx.fillStyle = '#9ca3af'; ctx.font = '13px monospace';
        ctx.fillText("Нажмите [🔁 R], чтобы сыграть снова", 320, 280);
        ctx.textAlign = 'left';
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(20, 5, 8, 0.94)';
        ctx.fillRect(0, 0, 640, 448);
        ctx.fillStyle = '#ef4444'; ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("ВЫ ПОГИБЛИ", 320, 190);
        ctx.fillStyle = '#f59e0b'; ctx.font = '14px monospace';
        ctx.fillText("Нажмите [🔁 R], чтобы начать заново", 320, 250);
        ctx.textAlign = 'left';
    }

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
