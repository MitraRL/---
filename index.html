<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>16-BIT: Пингвин и Расписание</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        } catch (e) {}
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
        }
        html, body {
            background: #05070a;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #d1d5db;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- СТАРТОВОЕ ОКНО ВЫБОРА РЕЖИМА --- */
        #start-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 10, 0.96);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 16px;
        }
        .modal-box {
            background: linear-gradient(145deg, #1b2233, #0f1422);
            border: 3px solid #fbbf24;
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
        }
        .modal-title {
            color: #fbbf24;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            margin-bottom: 6px;
        }
        .modal-subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-select-mode {
            background: #1e293b;
            border: 2px solid #38bdf8;
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
        }
        .btn-select-mode:active {
            background: #0284c7;
            transform: scale(0.97);
        }

        /* --- КОРПУС ИГРЫ --- */
        #console-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
            background: #0b0e14;
        }

        #screen-section {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #0b0e14;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            touch-action: none;
        }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
        }

        #top-bar {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        .btn-top {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #475569;
            color: #fff;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* --- СЕНСОРНЫЙ ГЕЙМПАД --- */
        #gamepad-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #0f1422;
            position: relative;
            border-top: 2px solid #1e293b;
            touch-action: none;
        }

        #joystick-touch-area {
            flex: 1 1 45%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: none;
        }
        #joystick-base {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            border: 2px solid #38bdf8;
            border-radius: 50%;
            position: relative;
        }
        #joystick-stick {
            width: 52px;
            height: 52px;
            background: radial-gradient(circle, #38bdf8, #0284c7);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 39px;
            left: 39px;
            pointer-events: none;
        }

        #actions-touch-area {
            flex: 1 1 55%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 58px);
            grid-template-rows: repeat(2, 58px);
            gap: 10px;
            justify-content: center;
            align-content: center;
            justify-items: center;
            align-items: center;
            touch-action: none;
        }
        .touch-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            touch-action: none;
            cursor: pointer;
        }
        .touch-btn:active {
            transform: scale(0.9);
            filter: brightness(1.3);
        }
        .btn-label {
            font-size: 8px;
            font-weight: 800;
            margin-top: -2px;
        }

        .btn-atk { background: radial-gradient(circle, #f59e0b, #b45309); border-color: #fbbf24; grid-column: 2; grid-row: 2; width: 66px; height: 66px; font-size: 24px; }
        .btn-def { background: radial-gradient(circle, #8b5cf6, #5b21b6); border-color: #a78bfa; grid-column: 1; grid-row: 2; }
        .btn-ice { background: radial-gradient(circle, #38bdf8, #0369a1); border-color: #7dd3fc; grid-column: 2; grid-row: 1; }
        .btn-dash { background: radial-gradient(circle, #10b981, #047857); border-color: #34d399; grid-column: 3; grid-row: 2; }
        .btn-ult { background: radial-gradient(circle, #f43f5e, #be123c); border-color: #fda4af; grid-column: 3; grid-row: 1; }

        .pc-help {
            margin-top: 8px;
            font-size: 11px;
            font-family: monospace;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .key {
            color: #fbbf24;
            font-weight: bold;
            background: #1e293b;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid #475569;
        }

        /* РЕЖИМ ПК */
        body.mode-pc #gamepad-section { display: none !important; }
        body.mode-pc #console-wrapper {
            max-width: 820px;
            max-height: 580px;
            height: auto;
            border-radius: 12px;
            border: 2px solid #374151;
            padding: 6px;
            background: linear-gradient(145deg, #1b202e, #0c0e14);
        }
        body.mode-pc #screen-section {
            height: 540px;
            width: 800px;
        }
        body.mode-pc .pc-help { display: flex; }

        /* РЕЖИМ ТЕЛЕФОНА */
        body.mode-mobile #console-wrapper {
            width: 100%;
            height: 100%;
            max-width: 500px;
        }
        body.mode-mobile #screen-section { flex: 1 1 54%; }
        body.mode-mobile #gamepad-section { flex: 1 1 46%; display: flex; }
        body.mode-mobile .pc-help { display: none !important; }
    </style>
</head>
<body class="mode-pc">

<!-- ВЫБОР УПРАВЛЕНИЯ -->
<div id="start-modal">
    <div class="modal-box">
        <div class="modal-title">★ ПИНГВИН И РАСПИСАНИЕ ★</div>
        <div class="modal-subtitle">Выберите платформу для запуска:</div>
        <div class="modal-buttons">
            <button class="btn-select-mode" id="btn-choose-pc" onclick="setControlMode('PC')">
                💻 КОМПЬЮТЕР (Клавиатура + Мышь)
            </button>
            <button class="btn-select-mode" id="btn-choose-mobile" onclick="setControlMode('MOBILE')">
                📱 СМАРТФОН (Сенсорный Геймпад)
            </button>
        </div>
    </div>
</div>

<div id="console-wrapper">
    <div id="screen-section">
        <canvas id="game" width="640" height="448"></canvas>
        <div class="scanlines"></div>

        <div id="top-bar">
            <button class="btn-top" id="btn-mode-switch">⚙️ РЕЖИМ</button>
            <button class="btn-top" id="btn-inv">🎒 ИНВЕНТАРЬ</button>
            <button class="btn-top" id="btn-swap">🔄 СМЕНА</button>
            <button class="btn-top" id="btn-restart">🔁 R</button>
        </div>
    </div>

    <div id="gamepad-section">
        <div id="joystick-touch-are
