<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>16-BIT: Пингвин и Расписание</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        } catch (e) {}
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #030712;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* КОНТЕЙНЕР ИГРЫ */
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* ЭКРАН */
        #screen-box {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
        }

        canvas {
            display: block;
            background: #0f172a;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        /* ВЕРХНЕЕ МЕНЮ */
        #top-bar {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 6px;
            z-index: 50;
        }
        .btn-top {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #475569;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        .btn-top:active { background: #38bdf8; color: #000; }

        /* --- РЕЖИМ ПК --- */
        body.mode-pc #game-container {
            width: auto;
            height: auto;
        }
        body.mode-pc #screen-box {
            border: 2px solid #334155;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(56, 189, 248, 0.2);
            padding: 4px;
            background: #1e293b;
        }
        body.mode-pc canvas {
            width: 640px;
            height: 448px;
            max-width: 95vw;
            max-height: 82vh;
        }
        body.mode-pc #gamepad-section {
            display: none !important;
        }
        body.mode-pc .pc-help {
            display: flex;
        }

        /* --- РЕЖИМ ТЕЛЕФОНА --- */
        body.mode-mobile #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            justify-content: space-between;
            background: #090d16;
        }
        body.mode-mobile #screen-box {
            width: 100%;
            flex: 1 1 54%;
            border-bottom: 2px solid #1e293b;
        }
        body.mode-mobile canvas {
            width: 100%;
            height: auto;
            max-height: 100%;
            aspect-ratio: 640 / 448;
        }
        body.mode-mobile #gamepad-section {
            width: 100%;
            flex: 1 1 46%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #0b0f19;
            touch-action: none;
        }
        body.mode-mobile .pc-help {
            display: none !important;
        }

        /* СЕНСОРНЫЙ ПУЛЬТ */
        #joystick-area {
            flex: 1 1 45%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #joystick-base {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #1e293b, #0f172a);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            position: relative;
        }
        #joystick-stick {
            width: 46px;
            height: 46px;
            background: radial-gradient(circle, #38bdf8, #0284c7);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 37px;
            left: 37px;
            pointer-events: none;
        }

        #actions-area {
            flex: 1 1 55%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(2, 56px);
            gap: 8px;
            justify-content: center;
            align-content: center;
            justify-items: center;
            align-items: center;
            touch-action: none;
        }
        .touch-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 19px;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            touch-action: none;
            cursor: pointer;
        }
        .touch-btn:active {
            transform: scale(0.9);
            filter: brightness(1.3);
        }
        .btn-label {
            font-size: 8px;
            font-weight: 800;
            margin-top: -2px;
        }

        .btn-atk { background: #d97706; border-color: #fbbf24; grid-column: 2; grid-row: 2; width: 64px; height: 64px; font-size: 24px; }
        .btn-def { background: #7c3aed; border-color: #a78bfa; grid-column: 1; grid-row: 2; }
        .btn-ice { background: #0284c7; border-color: #7dd3fc; grid-column: 2; grid-row: 1; }
        .btn-dash { background: #059669; border-color: #34d399; grid-column: 3; grid-row: 2; }
        .btn-ult { background: #be123c; border-color: #fda4af; grid-column: 3; grid-row: 1; }

        .pc-help {
            margin-top: 10px;
            font-size: 12px;
            font-family: monospace;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .key {
            color: #fbbf24;
            font-weight: bold;
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #475569;
        }
    </style>
</head>
<body class="mode-pc">

<div id="game-container">
    <div id="screen-box">
        <canvas id="game" width="640" height="448"></canvas>

        <div id="top-bar">
            <button class="btn-top" id="btn-mode-toggle">🖥️ ПК / 📱 ТЕЛ</button>
            <button class="btn-top" id="btn-inv">🎒 ИНВЕНТАРЬ</button>
            <button class="btn-top" id="btn-swap">🔄 СМЕНА</button>
            <button class="btn-top" id="btn-restart">🔁 R</button>
        </div>
    </div>

    <!-- ГЕЙМПАД ДЛЯ ТЕЛЕФОНА -->
    <div id="gamepad-section">
        <div id="joystick-area">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <div id="actions-area">
            <div class="touch-btn btn-ice" id="btn-ice">❄️<span class="btn-label">ЛЁД</span></div>
            <div class="touch-btn btn-ult" id="btn-ult">⚡<span class="btn-label">УЛЬТА</span></div>
            <div class="touch-btn btn-def" id="btn-def">🛡️<span class="btn-label">ЩИТ</span></div>
            <div class="touch-btn btn-atk" id="btn-atk">⚔️<span class="btn-label">УДАР</span></div>
            <div class="touch-btn btn-dash" id="btn-dash">💨<span class="btn-label">ДЭШ</span></div>
        </div>
    </div>
</div>

<div class="pc-help">
    <div><span class="key">WASD</span> Бег</div>
    <div><span class="key">ПКМ</span> Удар Мечом</div>
    <div><span class="key">ЛКМ</span> Щит / Парирование</div>
    <div><span class="key">СКМ / F</span> Сюрикен 🧊</div>
    <div><span class="key">E</span> Ульта</div>
    <div><span class="key">SHIFT</span> Дэш</div>
    <div><span class="key">TAB</span> Инвентарь</div>
</div>

<script>
// --- ПЕРЕКЛЮЧЕНИЕ РЕЖИМА УПРАВЛЕНИЯ ---
function setMode(mode) {
    document.body.className = (mode === 'PC') ? 'mode-pc' : 'mode-mobile';
}

function autoDetect() {
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 680;
    setMode(isMobile ? 'MOBILE' : 'PC');
}
autoDetect();

document.getElementById('btn-mode-toggle').addEventListener('click', () => {
    if (document.body.classList.contains('mode-pc')) setMode('MOBILE');
    else setMode('PC');
});

// --- 16-BIT AUDIO ENGINE ---
let actx = null;
let bgmTimer = null;
let bgmStep = 0;
let musicEnabled = true;

function initAudio() {
    try {
        if (!actx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                actx = new AudioCtx();
                startBGM();
            }
        } else if (actx.state === 'suspended') {
            actx.resume();
        }
    } catch (e) {}
}

window.addEventListener('pointerdown', initAudio, { once: true });
window.addEventListener('keydown', initAudio, { once: true });

const bassNotes = [110, 110, 130, 110, 146, 110, 130, 123];
const leadNotes = [220, 0, 261, 293, 329, 293, 261, 0, 329, 392, 440, 392, 329, 293, 261, 246];
const victoryLead = [329, 392, 523, 659, 783, 659, 523, 392, 440, 554, 659, 880, 783, 659, 523, 659];

function startBGM() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
        try {
            if (!musicEnabled || !actx || inventoryOpen || transition.active || document.hidden) return;
            const t = actx.currentTime;

            if (gameState === 'VICTORY') {
                const note = victoryLead[bgmStep % victoryLead.length];
                const vOsc = actx.createOscillator();
                const vGain = actx.createGain();
                vOsc.type = 'triangle';
                vOsc.frequency.setValueAtTime(note, t);
                vGain.gain.setValueAtTime(0.04, t);
                vGain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
                vOsc.connect(vGain); vGain.connect(actx.destination);
                vOsc.start(t); vOsc.stop(t + 0.16);
                bgmStep++;
                return;
            }

            const bFreq = bassNotes[bgmStep % bassNotes.length];
            const bOsc = actx.createOscillator();
            const bGain = actx.createGain();
            bOsc.type = 'sawtooth';
            bOsc.frequency.setValueAtTime((currentRoom === 'THRONE' ? bFreq * 1.2 : bFreq) / 2, t);
            bGain.gain.setValueAtTime(0.04, t);
            bGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            bOsc.connect(bGain); bGain.connect(actx.destination);
            bOsc.start(t); bOsc.stop(t + 0.18);

            const lFreq = leadNotes[bgmStep % leadNotes.length];
            if (lFreq > 0) {
                const lOsc = actx.createOscillator();
                const lGain = actx.createGain();
                lOsc.type = 'square';
                lOsc.frequency.setValueAtTime(currentRoom === 'THRONE' ? lFreq * 1.2 : lFreq, t);
                lGain.gain.setValueAtTime(0.02, t);
                lGain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                lOsc.connect(lGain); lGain.connect(actx.destination);
                lOsc.start(t); lOsc.stop(t + 0.15);
            }
            bgmStep++;
        } catch (e) {}
    }, 150);
}

function playSound(type) {
    if (!actx || document.hidden) return;
    try {
        const t = actx.currentTime;
        if (type === 'slash') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(360, t);
            gain.gain.setValueAtTime(0.25, t); gain.linearRampToValueAtTime(0.01, t + 0.1);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'frost_shuriken') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, t);
            gain.gain.setValueAtTime(0.2, t); gain.linearRampToValueAtTime(0.01, t + 0.15);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'freeze') {
            [1046, 1318].forEach((f, i) => {
                const osc = actx.createOscillator(); const gain = actx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(f, t + i * 0.04);
                gain.gain.setValueAtTime(0.15, t + i * 0.04);
                gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.06);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(t + i * 0.04); osc.stop(t + (i + 1) * 0.06);
            });
        } else if (type === 'parry') {
            const osc1 = actx.createOscillator(); const gain1 = actx.createGain();
            osc1.type = 'square'; osc1.frequency.setValueAtTime(987, t);
            gain1.gain.setValueAtTime(0.3, t); gain1.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc1.connect(gain1); gain1.connect(actx.destination);
            osc1.start(t); osc1.stop(t + 0.2);
        } else if (type === 'door_unlock') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(783, t);
            gain.gain.setValueAtTime(0.25, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'door_slam') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t);
            gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'spawn_portal') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(200, t);
            gain.gain.setValueAtTime(0.12, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'block') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(200, t);
            gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'ult_cast') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(554, t);
            gain.gain.setValueAtTime(0.25, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.3);
        } else if (type === 'coin' || type === 'potion') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(1000, t);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.08);
        } else if (type === 'golden_beam') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t);
            gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.12);
        } else if (type === 'fanfare') {
            [440, 659, 880].forEach((f, i) => {
                const osc = actx.createOscillator(); const gain = actx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(f, t + i * 0.1);
                gain.gain.setValueAtTime(0.2, t + i * 0.1);
                gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.1);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(t + i * 0.1); osc.stop(t + (i + 1) * 0.1);
            });
        } else if (type === 'hit') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(130, t);
            gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.08);
        } else if (type === 'item') {
            [523, 783].forEach((f, i) => {
                const osc = actx.createOscillator(); const gain = actx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(f, t + i * 0.06);
                gain.gain.setValueAtTime(0.2, t + i * 0.06);
                gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.06);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(t + i * 0.06); osc.stop(t + (i + 1) * 0.06);
            });
        }
    } catch(err) {}
}

// --- CANVAS & INPUT ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const keys = {};
let inventoryOpen = false;

window.addEventListener('contextmenu', e => e.preventDefault());

let mousePos = { x: 160, y: 112 };
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = 320 / (rect.width || 1);
    const scaleY = 224 / (rect.height || 1);
    mousePos.x = (e.clientX - rect.left) * scaleX;
    mousePos.y = (e.clientY - rect.top) * scaleY;
});

window.addEventListener('mousedown', e => {
    initAudio();
    if (gameState === 'VICTORY') {
        triggerStreamReaction();
        return;
    }
    if (e.button === 0) raiseShield();
    else if (e.button === 1) { e.preventDefault(); shootFrostShuriken(); }
    else if (e.button === 2) { e.preventDefault(); performMeleeAttack(); }
});

window.addEventListener('mouseup', e => {
    if (e.button === 0) player.isShielding = false;
});

window.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    if (e.code === 'KeyM') musicEnabled = !musicEnabled;
    if (e.code === 'KeyR') resetGame();
    if (e.code === 'KeyQ') switchWeapon();
    if (e.code === 'KeyE') activateUltimate();
    if (e.code === 'KeyF' || e.code === 'KeyX') shootFrostShuriken();
    if (e.code === 'KeyI' || e.code === 'Tab') { e.preventDefault(); inventoryOpen = !inventoryOpen; }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// --- СЕНСОРНЫЙ ДЖОЙСТИК ---
const touchJoystick = {
    active: false,
    startX: 0, startY: 0,
    x: 0, y: 0,
    touchId: null
};

const joyArea = document.getElementById('joystick-area');
const joyStick = document.getElementById('joystick-stick');

function handleJoyStart(e) {
    e.preventDefault();
    initAudio();
    if (gameState === 'VICTORY') return;
    const touch = e.changedTouches[0];
    touchJoystick.active = true;
    touchJoystick.touchId = touch.identifier;
    touchJoystick.startX = touch.clientX;
    touchJoystick.startY = touch.clientY;
    touchJoystick.x = 0; touchJoystick.y = 0;
    joyStick.style.transform = `translate(0px, 0px)`;
}

function handleJoyMove(e) {
    e.preventDefault();
    if (!touchJoystick.active) return;

    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === touchJoystick.touchId) {
            const dx = touch.clientX - touchJoystick.startX;
            const dy = touch.clientY - touchJoystick.startY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = 45;

            let normX = dx / (dist || 1);
            let normY = dy / (dist || 1);
            let clamped = Math.min(dist, maxRadius);

            joyStick.style.transform = `translate(${normX * clamped}px, ${normY * clamped}px)`;

            if (dist > 6) {
                touchJoystick.x = normX * (clamped / maxRadius);
                touchJoystick.y = normY * (clamped / maxRadius);
            } else {
                touchJoystick.x = 0; touchJoystick.y = 0;
            }
            break;
        }
    }
}

function handleJoyEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchJoystick.touchId) {
            touchJoystick.active = false;
            touchJoystick.touchId = null;
            touchJoystick.x = 0; touchJoystick.y = 0;
            joyStick.style.transform = `translate(0px, 0px)`;
            break;
        }
    }
}

joyArea.addEventListener('touchstart', handleJoyStart, { passive: false });
joyArea.addEventListener('touchmove', handleJoyMove, { passive: false });
joyArea.addEventListener('touchend', handleJoyEnd, { passive: false });
joyArea.addEventListener('touchcancel', handleJoyEnd, { passive: false });

function bindTouch(id, onDown, onUp) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        initAudio();
        btn.classList.add('active');
        if (onDown) onDown();
    }, { passive: false });

    btn.addEventListener('touchend', e => {
        e.preventDefault();
        btn.classList.remove('active');
        if (onUp) onUp();
    }, { passive: false });

    btn.addEventListener('touchcancel', () => {
        btn.classList.remove('active');
        if (onUp) onUp();
    });
}

bindTouch('btn-atk', () => {
    if (gameState === 'VICTORY') triggerStreamReaction();
    else performMeleeAttack();
});
bindTouch('btn-def', () => raiseShield(), () => { player.isShielding = false; });

function triggerDash() {
    if (!player.isSliding && player.sp >= 20 && !player.isShielding) {
        let sx = touchJoystick.active ? touchJoystick.x : 0;
        let sy = touchJoystick.active ? touchJoystick.y : 0;
        if (sx === 0 && sy === 0) {
            if (player.facing === 'up') sy = -1;
            if (player.facing === 'down') sy = 1;
            if (player.facing === 'left') sx = -1;
            if (player.facing === 'right') sx = 1;
        }
        const len = Math.hypot(sx, sy) || 1;
        player.isSliding = true;
        player.slideTimer = 18;
        player.slideDir = { x: sx / len, y: sy / len };
        player.sp -= 20;
        player.invul = 20;
        playSound('item');
    }
}

            vx = touchJoystick.x * 4.0;
            vy = touchJoystick.y * 4.0;
        } else {
            if (player.facing === 'right') vx = 4.0;
            if (player.facing === 'left') vx = -4.0;
            if (player.facing === 'up') vy = -4.0;
            if (player.facing === 'down') vy = 4.0;

        playerShots.push({
            x: player.x + 8, y: player.y + 9,

            type: 'frost_shuriken', rot: 0

// --- RENDER HELPERS ---
function drawShadow(x, y, w, h) {
    ctx.fillStyle = 'rgba(5, 7, 13, 0.45)';
    ctx.beginPath();
    ctx.ellipse((x + w / 2) | 0, (y + h) | 0, (w / 2.1) | 0, 3, 0, 0, Math.PI * 2);
    ctx.fill();
}

function draw16BitPortal(p) {
    const px = p.x | 0, py = p.y | 0;
    const progress = 1 - (p.timer / p.maxTimer);
    ctx.save();
    ctx.translate(px + 7, py + 7);
    ctx.rotate(Date.now() * 0.01);
    ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, (8 * progress + 2) | 0, (4 * progress + 1) | 0, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#7c3aed'; ctx.beginPath(); ctx.arc(0, 0, (4 * progress + 1) | 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function draw16BitChest(c) {
    const cx = c.x | 0, cy = c.y | 0;
    drawShadow(cx, cy, 16, 14);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(cx, cy, 16, 14);
    if (c.opened) {
        ctx.fillStyle = '#78350f'; ctx.fillRect(cx + 1, cy + 5, 14, 8);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(cx + 2, cy + 2, 12, 4);
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(cx + 1, cy + 6, 14, 2);
    } else {
        ctx.fillStyle = '#b45309'; ctx.fillRect(cx + 1, cy + 1, 14, 12);
        ctx.fillStyle = '#d97706'; ctx.fillRect(cx + 2, cy + 2, 12, 10);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(cx + 2, cy + 1, 2, 12); ctx.fillRect(cx + 12, cy + 1, 2, 12); ctx.fillRect(cx + 7, cy + 6, 2, 3);
    }
}

function draw16BitPotion(d) {
    const dx = d.x | 0;
    const dy = (d.y + Math.sin(Date.now() * 0.006 + d.bobTimer) * 2) | 0;
    drawShadow(dx, dy + 2, 8, 8);

    if (d.type === 'potion_hp') {
        ctx.fillStyle = '#881337'; ctx.fillRect(dx + 2, dy, 4, 2);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(dx + 1, dy + 2, 6, 7);
        ctx.fillStyle = '#fca5a5'; ctx.fillRect(dx + 2, dy + 3, 2, 2);
    } else if (d.type === 'potion_sp') {
        ctx.fillStyle = '#0369a1'; ctx.fillRect(dx + 2, dy, 4, 2);
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(dx + 1, dy + 2, 6, 7);
        ctx.fillStyle = '#bae6fd'; ctx.fillRect(dx + 2, dy + 3, 2, 2);
    } else if (d.type === 'star_hype') {
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(dx + 1, dy + 1, 6, 6);
        ctx.fillStyle = '#fff'; ctx.fillRect(dx + 2, dy + 2, 2, 2);
    }
}

function draw16BitPenguin(p) {
    const px = p.x | 0, py = p.y | 0;
    drawShadow(px, py, p.w, p.h);

    if (p.holdTimer > 0) {
        ctx.fillStyle = '#0f172a'; ctx.fillRect(px + 2, py + 4, 12, 14);
        ctx.fillStyle = '#f8fafc'; ctx.fillRect(px + 4, py + 8, 8, 9);
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(px + 6, py + 8, 4, 3);
        ctx.fillStyle = '#2563eb'; ctx.fillRect(px + 1, py + 2, 3, 6); ctx.fillRect(px + 12, py + 2, 3, 6);
        if (p.holdingItem === 'golden_fish') {
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(px + 3, py - 10, 10, 6);
            ctx.fillStyle = '#fff'; ctx.fillRect(px + 5, py - 9, 6, 2);
        } else if (p.holdingItem === 'armored_scarf') {
            ctx.fillStyle = '#cbd5e1'; ctx.fillRect(px + 3, py - 8, 10, 4);
            ctx.fillStyle = '#64748b'; ctx.fillRect(px + 6, py - 9, 4, 6);
        }
        return;
    }

    if (p.isSliding) {
        ctx.fillStyle = '#0f172a'; ctx.fillRect(px, py + 6, 18, 10);
        ctx.fillStyle = '#f8fafc'; ctx.fillRect(px + 2, py + 10, 14, 5);
        ctx.fillStyle = '#2563eb'; ctx.fillRect(px + 2, py + 7, 14, 4);
        ctx.fillStyle = p.armor === 'armored_scarf' ? '#cbd5e1' : '#e11d48';
        ctx.fillRect(px + (p.facing === 'left' ? 2 : 12), py + 6, 4, 3);
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(px + (p.facing === 'left' ? -2 : 16), py + 8, 4, 3);
        return;
    }

    const bounce = p.walkFrame === 1 ? -1 : 0;
    ctx.fillStyle = '#0f172a'; ctx.fillRect(px + 2, py + bounce, 12, 18);
    ctx.fillStyle = '#2563eb'; ctx.fillRect(px + 2, py + 1 + bounce, 12, 15);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(px + 4, py + 6 + bounce, 8, 9);
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(px + 5, py + 6 + bounce, 6, 7);

    if (p.armor === 'armored_scarf') {
        ctx.fillStyle = '#64748b'; ctx.fillRect(px + 3, py + 5 + bounce, 10, 3);
        ctx.fillStyle = '#cbd5e1'; ctx.fillRect(px + 4, py + 5 + bounce, 8, 2);
    } else {
        ctx.fillStyle = '#be123c'; ctx.fillRect(px + 3, py + 5 + bounce, 10, 3);
        ctx.fillStyle = '#e11d48'; ctx.fillRect(px + 4, py + 5 + bounce, 8, 2);
    }

    ctx.fillStyle = '#0f172a';
    if (p.facing === 'left') {
        ctx.fillRect(px + 3, py + 3 + bounce, 2, 3); ctx.fillStyle = '#fff'; ctx.fillRect(px + 3, py + 3 + bounce, 1, 1);
    } else if (p.facing === 'right') {
        ctx.fillRect(px + 11, py + 3 + bounce, 2, 3); ctx.fillStyle = '#fff'; ctx.fillRect(px + 12, py + 3 + bounce, 1, 1);
    } else {
        ctx.fillRect(px + 4, py + 3 + bounce, 2, 3); ctx.fillRect(px + 10, py + 3 + bounce, 2, 3);
        ctx.fillStyle = '#fff'; ctx.fillRect(px + 4, py + 3 + bounce, 1, 1); ctx.fillRect(px + 10, py + 3 + bounce, 1, 1);
    }

    ctx.fillStyle = '#f59e0b'; ctx.fillRect(px + 6, py + 5 + bounce, 4, 3);
    ctx.fillStyle = '#ea580c'; ctx.fillRect(px + 3, py + 16, 3, 2); ctx.fillRect(px + 10, py + 16, 3, 2);

    if (p.isShielding) {
        ctx.save();
        ctx.translate(px + 8, py + 9);
        let angle = 0;
        if (p.facing === 'right') angle = 0;
        if (p.facing === 'down') angle = Math.PI / 2;
        if (p.facing === 'left') angle = Math.PI;
        if (p.facing === 'up') angle = -Math.PI / 2;
        ctx.rotate(angle);
        ctx.fillStyle = p.parryWindow > 0 ? '#38bdf8' : '#0284c7'; ctx.fillRect(10, -7, 4, 14);
        ctx.fillStyle = '#e0f2fe'; ctx.fillRect(11, -5, 2, 10);
        ctx.restore();
    }

    if (p.isAttacking) {
        ctx.save();
        ctx.translate(px + 8, py + 8);
        let angle = 0;
        if (p.facing === 'right') angle = 0;
        if (p.facing === 'down') angle = Math.PI / 2;
        if (p.facing === 'left') angle = Math.PI;
        if (p.facing === 'up') angle = -Math.PI / 2;
        ctx.rotate(angle);
        const isGold = p.weapon === 'golden_fish';
        ctx.strokeStyle = isGold ? '#fbbf24' : '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(4, 0, 18, -Math.PI / 3, Math.PI / 3); ctx.stroke();
        ctx.fillStyle = isGold ? '#d97706' : '#0284c7'; ctx.fillRect(10, -4, 12, 7);
        ctx.restore();
    }
}

function draw16BitBoss(b) {
    const bx = b.x | 0, by = b.y | 0;
    drawShadow(bx, by, b.w, b.h);
    if (b.invul > 0 && b.invul % 4 > 2) return;

    ctx.fillStyle = b.isRage ? '#b91c1c' : '#1e293b';
    ctx.fillRect(bx + 2, by, 24, 30); ctx.fillRect(bx, by + 4, 28, 24);
    ctx.fillStyle = b.isRage ? '#dc2626' : '#14532d';
    ctx.fillRect(bx + 4, by + 1, 20, 7);
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx + 11, by + 3, 6, 4);

    ctx.fillStyle = b.isRage ? '#fca5a5' : '#fbcfe8';
    ctx.fillRect(bx + 6, by + 10, 16, 9);
    ctx.fillStyle = '#111'; ctx.fillRect(bx + 8, by + 12, 3, 2); ctx.fillRect(bx + 17, by + 12, 3, 2);
    ctx.fillStyle = '#881337'; ctx.fillRect(bx + 12, by + 16, 4, 1);

    ctx.fillStyle = b.isRage ? '#b91c1c' : '#166534';
    ctx.fillRect(bx + 4, by + 19, 20, 11);
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx + 2, by + 19, 4, 4); ctx.fillRect(bx + 22, by + 19, 4, 4);

    ctx.fillStyle = '#0f172a'; ctx.fillRect(bx + 5, by + 23, 18, 9);
    ctx.fillStyle = b.isRage ? '#ef4444' : '#22c55e'; ctx.fillRect(bx + 13, by + 24, 3, 3);
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(bx + 18, by + 25, 2, 2);

    if (b.state === 'OVERHEAT') {
        if (Math.floor(Date.now() / 200) % 2 === 0) {
            ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 7px monospace'; ctx.fillText("БЕЙ!", bx + 6, by - 6);
        }
    }
}

function draw16BitMinion(m) {
    const mx = m.x | 0, my = m.y | 0;
    drawShadow(mx, my, 14, 14);
    if (m.invul > 0 && m.invul % 4 > 2) return;

    ctx.fillStyle = '#4c1d95'; ctx.fillRect(mx + 1, my, 12, 14);
    ctx.fillStyle = '#9333ea'; ctx.fillRect(mx + 2, my + 2, 10, 10);
    ctx.fillStyle = '#09090b'; ctx.fillRect(mx + 2, my + 5, 10, 3);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(mx + 3, my + 5, 2, 1); ctx.fillRect(mx + 8, my + 5, 2, 1);

    if (m.freezeTimer > 0) {
        ctx.fillStyle = 'rgba(165, 243, 252, 0.7)';
        ctx.fillRect(mx - 2, my - 2, 18, 18);
        ctx.strokeStyle = '#38bdf8';
        ctx.strokeRect(mx - 2, my - 2, 18, 18);
    }
}

}

}

function update() {
    if (gameState === 'VICTORY') {
        streamChatTimer++;
        if (streamChatTimer > 45) {
            streamChatTimer = 0;
            const randomMsg = chatPool[Math.floor(Math.random() * chatPool.length)];
            streamChat.push(randomMsg);
            if (streamChat.length > 7) streamChat.shift();
        }

        for (let i = streamReactionParticles.length - 1; i >= 0; i--) {
            const p = streamReactionParticles[i];
            p.y += p.vy; p.x += p.vx; p.life--;
            if (p.life <= 0) streamReactionParticles.splice(i, 1);
        }
        return;
    }

    if (transition.active) {
        if (transition.state === 'in') {
            transition.alpha += 0.08;
            if (transition.alpha >= 1) {
                transition.alpha = 1;
                transition.state = 'out';
                currentRoom = transition.targetRoom;

                if (currentRoom === 'THRONE') {
                    player.x = 152; player.y = 190; player.facing = 'up';
                    boss.active = true; throneDoorLocked = true;
                    minions = []; spawnPortals = []; spawnTimer = 60;
                    playSound('door_slam');
                    dialog = {
                        speaker: "ГЕНЕРАЛ 1:6",
                        text: "ТЫ ПОСМЕЛ ВОЙТИ В МОЙ ТРОННЫЙ ЗАЛ?! БАМБОЧИ, УНИЧТОЖИТЬ ЕГО!",
                        timer: 280, portrait: 'boss'
                    };
                }
            }
        } else {
            transition.alpha -= 0.08;
            if (transition.alpha <= 0) {
                transition.alpha = 0;
                transition.active = false;
            }
        }
        return;
    }

    if (inventoryOpen) return;
    if (dialog.timer > 0) dialog.timer--;
    if (screenShake > 0) screenShake *= 0.86;

    torchTimer++;
    if (torchTimer > 6) { torchFrame = (torchFrame + 1) % 3; torchTimer = 0; }

    if (keys['Enter']) dialog.timer = 0;
    if (player.hp <= 0) { gameState = 'GAMEOVER'; return; }

    if (player.invul > 0) player.invul--;
    if (player.holdTimer > 0) { player.holdTimer--; return; }

    if (boss.active && boss.hp <= 0) {
        triggerVictory();
        return;
    }

    const aliveBambochi = minions.length;
    const maxAllowed = (currentRoom === 'THRONE') ? MAX_BAMBOCHI_THRONE : MAX_BAMBOCHI_CATACOMBS;

    if (aliveBambochi < maxAllowed && spawnPortals.length === 0) {
        spawnTimer--;
        if (spawnTimer <= 0) {
            spawnTimer = (currentRoom === 'THRONE') ? 180 : 220;
            if (currentRoom === 'THRONE') {
                const sideX = Math.random() > 0.5 ? ((Math.random() * 50 + 40) | 0) : ((Math.random() * 50 + 230) | 0);
                const sideY = (Math.random() * 80 + 70) | 0;
                spawnBambochPortal(sideX, sideY);
            } else {
                spawnBambochPortal();
            }
        }
    }

    if (currentRoom === 'CATACOMBS') {
        if (player.y <= 30 && player.x >= 135 && player.x <= 170) {
            if (gateOpened) {
                startRoomTransition('THRONE');
                return;
            } else {
                if (dialog.timer === 0) {
                    dialog = {
                        speaker: "ВОРОТА ТРОНА",
                        text: `Заперто на 3 печати! Собрано свитков: ${player.schedules}/3`,
                        timer: 120, portrait: 'penguin'
                    };
                }
            }
        }
    }

    for (let i = spawnPortals.length - 1; i >= 0; i--) {
        const portal = spawnPortals[i];
        portal.timer--;
        if (portal.timer <= 0) {
            minions.push({
                x: portal.x, y: portal.y, hp: 3, maxHp: 3,
                speed: 0.65, dirX: (Math.random() > 0.5 ? 1 : -1), dirY: 0,
                timer: 30, invul: 0, freezeTimer: 0, dead: false, name: 'Бамбоч'
            });
            spawnSparks(portal.x + 7, portal.y + 7, '#7c3aed', 6);
            addFloatingText(portal.x, portal.y - 6, "БАМБОЧ!", '#c084fc');
            spawnPortals.splice(i, 1);
        }
    }

    if (player.sp < player.maxSp && !player.isShielding) player.sp += 0.5;

    if (player.isShielding) {
        player.sp = Math.max(0, player.sp - 0.2);
        if (player.parryWindow > 0) player.parryWindow--;
        if (player.sp <= 0) {
            player.isShielding = false;
            playSound('block');
        }
    }

    if ((keys['ShiftLeft'] || keys['ShiftRight']) && !player.isSliding && player.sp >= 20 && !player.isShielding) {
        triggerDash();
    }

    if (player.isSliding) {
        player.slideTimer--;
        player.x += player.slideDir.x * 3.6;
        player.y += player.slideDir.y * 3.6;
        if (player.slideTimer <= 0) player.isSliding = false;
    } else {
        let dx = 0, dy = 0;
        if (keys['KeyW'] || keys['ArrowUp'])    { dy = -1; player.facing = 'up'; }
        if (keys['KeyS'] || keys['ArrowDown'])  { dy = 1;  player.facing = 'down'; }
        if (keys['KeyA'] || keys['ArrowLeft'])  { dx = -1; player.facing = 'left'; }
        if (keys['KeyD'] || keys['ArrowRight']) { dx = 1;  player.facing = 'right'; }

        if (touchJoystick.active && (touchJoystick.x !== 0 || touchJoystick.y !== 0)) {
            dx = touchJoystick.x; dy = touchJoystick.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                player.facing = dx > 0 ? 'right' : 'left';
            } else {
                player.facing = dy > 0 ? 'down' : 'up';
            }
        }

        if (dx !== 0 || dy !== 0) {
            player.walkTimer++;
            if (player.walkTimer > 7) { player.walkFrame = (player.walkFrame + 1) % 2; player.walkTimer = 0; }
            if (!touchJoystick.active && dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
            const currentSpeed = player.isShielding ? player.speed * 0.5 : player.speed;
            player.x += dx * currentSpeed;
            player.y += dy * currentSpeed;
        } else {
            player.walkFrame = 0;
        }
    }

    player.x = Math.max(18, Math.min(302 - player.w, player.x));
    player.y = Math.max(26, Math.min(194 - player.h, player.y));

    if (player.attackTimer > 0) {
        player.attackTimer--;
        if (player.attackTimer <= 6) player.isAttacking = false;
    }

    let slashBox = null;
    if (player.isAttacking || player.isSliding) {
        const dist = player.isSliding ? 20 : 18;
        if (player.facing === 'right') slashBox = { x: player.x + 8, y: player.y - 6, w: dist, h: player.h + 12 };
        if (player.facing === 'left')  slashBox = { x: player.x - dist + 4, y: player.y - 6, w: dist, h: player.h + 12 };
        if (player.facing === 'up')    slashBox = { x: player.x - 6, y: player.y - dist + 4, w: player.w + 12, h: dist };
        if (player.facing === 'down')  slashBox = { x: player.x - 6, y: player.y + 8, w: player.w + 12, h: dist };
    }

    if (currentRoom === 'CATACOMBS') {
        chests.forEach(c => {
            if (!c.opened && slashBox) {
                if (slashBox.x < c.x + 16 && slashBox.x + slashBox.w > c.x &&
                    slashBox.y < c.y + 14 && slashBox.y + slashBox.h > c.y) {
                    c.opened = true;
                    player.holdingItem = c.item;
                    player.holdTimer = 60;
                    playSound('fanfare');
                    spawnSparks(c.x + 8, c.y + 7, '#fbbf24', 8);

                    if (c.item === 'golden_fish') {
                        player.hasGoldenFish = true; player.weapon = 'golden_fish';
                        dialog = { speaker: "НАХОДКА!", text: "Получена ЗОЛОТАЯ РЫБА! Двойной урон и волны при полном HP!", timer: 300, portrait: 'penguin' };
                    } else if (c.item === 'armored_scarf') {
                        player.hasArmoredScarf = true; player.armor = 'armored_scarf';
                        player.maxHp = 8; player.hp = player.maxHp;
                        dialog = { speaker: "НАХОДКА!", text: "Экипирован БРОНИРОВАННЫЙ ШАРФ! +2 Макс. HP и защита от урона!", timer: 300, portrait: 'penguin' };
                    }
                }
            }
        });

        scrolls.forEach((s) => {
            if (!s.collected && Math.hypot(player.x + 8 - (s.x + 6), player.y + 9 - (s.y + 5)) < 16) {
                s.collected = true;
                player.schedules++;
                addHype(35);
                playSound('item');
                spawnSparks(s.x + 6, s.y + 5, '#fde68a', 8);

                if (player.schedules === 1) dialog = { speaker: "РАСПИСАНИЕ 1/3", text: "'...Вторник: Фаворит запускает стрим в 19:00...'", timer: 240, portrait: 'penguin' };
                else if (player.schedules === 2) dialog = { speaker: "РАСПИСАНИЕ 2/3", text: "'...Пятница: Кооп-битва с генералами...'", timer: 240, portrait: 'penguin' };
                else if (player.schedules === 3) {
                    gateOpened = true;
                    screenShake = 10;
                    playSound('door_unlock');
                    dialog = { speaker: "ВРАТА ОТКРЫТЫ!", text: "Все 3 свитка собраны! Северные ворота в Тронный Зал распахнулись!", timer: 320, portrait: 'penguin' };
                }
            }
        });
    }

    // СБОР ЗЕЛИЙ
    for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.life--;
        if (Math.hypot(player.x + 8 - (d.x + 4), player.y + 9 - (d.y + 4)) < 14) {
            playSound('potion');
            if (d.type === 'potion_hp') {
                player.hp = Math.min(player.maxHp, player.hp + 2);
                addFloatingText(player.x, player.y - 8, "+2 HP! ❤️", '#ef4444');
            } else if (d.type === 'potion_sp') {
                player.sp = Math.min(player.maxSp, player.sp + 50);
                addFloatingText(player.x, player.y - 8, "+50 SP! ⚡", '#38bdf8');
            } else if (d.type === 'star_hype') {
                addHype(25);
                addFloatingText(player.x, player.y - 8, "+HYPE! ⭐", '#fbbf24');
            }
            drops.splice(i, 1);
            continue;
        }
        if (d.life <= 0) drops.splice(i, 1);
    }

    // СНАРЯДЫ ИГРОКА
    for (let i = playerShots.length - 1; i >= 0; i--) {
        const ps = playerShots[i];
        ps.x += ps.vx; ps.y += ps.vy;
        ps.life--; ps.rot += 0.25;

        minions.forEach(m => {
            if (m.hp > 0 && !m.dead && Math.hypot(ps.x - (m.x + 7), ps.y - (m.y + 7)) < 12) {
                const dmg = (ps.type === 'golden_wave') ? 3 : 2;
                m.hp -= dmg; m.invul = 15;

                if (ps.type === 'frost_shuriken') {
                    m.freezeTimer = 90;
                    playSound('freeze');
                    addFloatingText(m.x, m.y - 4, `FROZEN! -${dmg}`, '#38bdf8');
                } else {
                    playSound('hit');
                    addFloatingText(m.x, m.y - 4, `-${dmg}`, '#fbbf24');
                }

                if (m.hp <= 0 && !m.dead) {
                    m.dead = true;
                    tryDropPotion(m.x, m.y);
                }
                addHype(12);
                ps.life = 0;
            }
        });

        if (currentRoom === 'THRONE' && boss.active && boss.hp > 0 && boss.invul === 0) {
            if (ps.x > boss.x && ps.x < boss.x + boss.w && ps.y > boss.y && ps.y < boss.y + boss.h) {
                const dmg = (ps.type === 'golden_wave') ? 3 : 2;
                boss.hp -= dmg; boss.invul = 15; boss.hitStun = 10;
                addHype(15);
                playSound(ps.type === 'frost_shuriken' ? 'freeze' : 'hit');
                addFloatingText(boss.x + 8, boss.y - 6, `RANGED -${dmg}!`, '#38bdf8');
                ps.life = 0;

                if (boss.hp <= 0) {
                    triggerVictory();
                    return;
                }
            }
        }

        if (ps.life <= 0 || ps.x < 10 || ps.x > 310 || ps.y < 20 || ps.y > 210) {
            playerShots.splice(i, 1);
        }
    }

    // УЛЬТА
    for (let i = ultProjectiles.length - 1; i >= 0; i--) {
        const up = ultProjectiles[i];
        up.y += up.vy; up.life--;

        if (up.y > 40) {
            if (Math.random() < 0.15) playSound('coin');

            minions.forEach(m => {
                if (m.hp > 0 && !m.dead && Math.hypot(up.x - (m.x + 7), up.y - (m.y + 7)) < 16) {
                    m.hp -= 2; m.invul = 15;
                    if (m.hp <= 0 && !m.dead) {
                        m.dead = true;
                        tryDropPotion(m.x, m.y);
                    }
                }
            });

            if (currentRoom === 'THRONE' && boss.active && boss.hp > 0 && boss.invul === 0) {
                if (up.x > boss.x && up.x < boss.x + boss.w && up.y > boss.y && up.y < boss.y + boss.h) {
                    const ultDmg = up.type === 'giant_fish' ? 6 : 2;
                    boss.hp -= ultDmg; boss.invul = 15; boss.hitStun = 15;
                    screenShake = 8; playSound('hit');
                    addFloatingText(boss.x + 8, boss.y - 6, `ULT -${ultDmg}!`, '#f43f5e');

                    if (boss.hp <= 0) {
                        triggerVictory();
                        return;
                    }
                }
            }
        }

        if (up.y > 220 || up.life <= 0) {
            ultProjectiles.splice(i, 1);
        }
    }

    const baseDamage = (player.weapon === 'golden_fish') ? 2 : 1;

    // БАМБОЧИ
    for (let i = minions.length - 1; i >= 0; i--) {
        const m = minions[i];
        if (m.dead || m.hp <= 0) {
            minions.splice(i, 1);
            continue;
        }

        if (m.invul > 0) m.invul--;
        if (m.freezeTimer > 0) {
            m.freezeTimer--;
            continue;
        }

        m.timer--;
        if (m.timer <= 0) {
            m.timer = 50 + Math.random() * 30;
            const angle = Math.atan2(player.y - m.y, player.x - m.x);
            m.dirX = Math.cos(angle); m.dirY = Math.sin(angle);
        }
        m.x += m.dirX * m.speed; m.y += m.dirY * m.speed;

        if (player.invul === 0 && Math.hypot(player.x + 8 - (m.x + 7), player.y + 9 - (m.y + 7)) < 12) {
            if (player.isShielding) {
                playSound('block'); player.sp -= 15;
                m.x -= m.dirX * 16; m.y -= m.dirY * 16;
                addFloatingText(player.x, player.y - 6, "BLOCKED!", '#38bdf8');
            } else {
                player.hp--; player.invul = player.armor === 'armored_scarf' ? 60 : 45;
                screenShake = 5; playSound('hit');
                addFloatingText(player.x, player.y - 6, "-1 HP", '#ef4444');
            }
        }

        if (slashBox && m.invul === 0) {
            if (slashBox.x < m.x + 14 && slashBox.x + slashBox.w > m.x &&
                slashBox.y < m.y + 14 && slashBox.y + slashBox.h > m.y) {
                m.hp -= baseDamage; m.invul = 15; addHype(12);
                playSound('hit');
                addFloatingText(m.x, m.y - 4, `БАМБОЧ -${baseDamage}`, '#fbbf24');
                m.x -= m.dirX * 14; m.y -= m.dirY * 14;

                if (m.hp <= 0 && !m.dead) {
                    m.dead = true;
                    tryDropPotion(m.x, m.y);
                }
            }
        }
    }

    // БОСС
    if (currentRoom === 'THRONE' && boss.active && boss.hp > 0) {
        if (boss.invul > 0) boss.invul--;

        if (boss.hp <= boss.maxHp / 2 && !boss.isRage) {
            boss.isRage = true; boss.baseSpeed = 1.0;
            screenShake = 10; playSound('door_slam');
            spawnBambochPortal(60, 100); spawnBambochPortal(240, 100);
            tryDropPotion(160, 120, 'potion_hp');
            dialog = {
                speaker: "ГЕНЕРАЛ 1:6",
                text: "БАМБОЧИ, НА ПОМОЩЬ! КРАСНОЕ КОЛЬЦО СМЕРТИ АКТИВИРОВАНО!",
                timer: 220, portrait: 'boss'
            };
        }

        if (boss.hitStun > 0) {
            boss.hitStun--;
        } else {
            if (boss.state === 'PATROL') {
                boss.x += boss.baseSpeed * boss.dir;
                if (boss.x > 260) boss.dir = -1;
                if (boss.x < 32)  boss.dir = 1;
                boss.shootTimer--;
                if (boss.shootTimer <= 0) boss.state = 'SHOOT';
            } else if (boss.state === 'SHOOT') {
                const btnTypes = [
                    { char: 'A', color: '#22c55e' }, { char: 'B', color: '#ef4444' },
                    { char: 'X', color: '#38bdf8' }, { char: 'Y', color: '#eab308' }
                ];
                const btn = btnTypes[Math.floor(Math.random() * btnTypes.length)];
                const angle = Math.atan2(player.y + 9 - (boss.y + 24), player.x + 8 - (boss.x + 14));

                projectiles.push({
                    x: boss.x + 14, y: boss.y + 24,
                    vx: Math.cos(angle) * 2.2, vy: Math.sin(angle) * 2.2,
                    btn: btn.char, color: btn.color, life: 140, reflected: false
                });

                boss.state = 'OVERHEAT';
                boss.overheatTimer = boss.isRage ? 45 : 75;
            } else if (boss.state === 'OVERHEAT') {
                boss.overheatTimer--;
                if (boss.overheatTimer <= 0) {
                    boss.state = 'PATROL';
                    boss.shootTimer = boss.isRage ? 40 : 65;
                }
            }
        }

        if (slashBox && boss.invul === 0) {
            if (slashBox.x < boss.x + boss.w && slashBox.x + slashBox.w > boss.x &&
                slashBox.y < boss.y + boss.h && slashBox.y + slashBox.h > boss.y) {
                const totalDmg = player.isSliding ? (baseDamage + 2) : baseDamage;
                boss.hp -= totalDmg; boss.invul = 20; boss.hitStun = 12;
                addHype(18); screenShake = 6; playSound('hit');
                addFloatingText(boss.x + 8, boss.y - 6, `-${totalDmg} CRIT!`, '#fbbf24');

                if (boss.hp <= 0) {
                    triggerVictory();
                    return;
                }
            }
        }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.x += pr.vx; pr.y += pr.vy; pr.life--;

        if (pr.reflected) {
            if (currentRoom === 'THRONE' && boss.active && boss.hp > 0 && boss.invul === 0) {
                if (Math.hypot(pr.x - (boss.x + 14), pr.y - (boss.y + 16)) < 16) {
                    boss.hp -= 3; boss.invul = 20; boss.hitStun = 25;
                    screenShake = 8; playSound('hit');
                    addFloatingText(boss.x + 8, boss.y - 6, "PARRY COUNTER -3!", '#38bdf8');
                    projectiles.splice(i, 1);

                    if (boss.hp <= 0) {
                        triggerVictory();
                        return;
                    }
                    continue;
                }
            }
        } else {
            if (player.invul === 0 && Math.hypot(player.x + 8 - pr.x, player.y + 9 - pr.y) < 12) {
                if (player.isShielding && player.parryWindow > 0) {
                    pr.reflected = true;
                    pr.vx = -pr.vx * 1.6; pr.vy = -pr.vy * 1.6;
                    pr.color = '#38bdf8'; pr.life = 100;
                    playSound('parry'); screenShake = 6; addHype(30);
                    addFloatingText(player.x - 4, player.y - 12, "PERFECT PARRY!", '#38bdf8');
                    continue;
                } else if (player.isShielding) {
                    player.sp -= 15; playSound('block');
                    addFloatingText(player.x, player.y - 6, "BLOCKED", '#0284c7');
                    projectiles.splice(i, 1);
                    continue;
                } else {
                    player.hp--; player.invul = player.armor === 'armored_scarf' ? 60 : 45;
                    screenShake = 5; playSound('hit');
                    addFloatingText(player.x, player.y - 6, "-1 HP", pr.color);
                    projectiles.splice(i, 1);
                    continue;
                }
            }
        }

        if (pr.life <= 0 || pr.x < 0 || pr.x > 320 || pr.y < 0 || pr.y > 224) {
            projectiles.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy; ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Запуск игрового цикла
loop();
</script>
