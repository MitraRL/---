<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>16-BIT: Пингвин и Расписание (Fixed HD)</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        } catch (e) {}
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
        }
        html, body {
            background: #05070a;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- КОРПУС ИГРЫ --- */
        #console-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
            background: #0b0e14;
        }

        /* ЭКРАН (С ГАРАНТИЕЙ ОТОБРАЖЕНИЯ НА МОБИЛКАХ) */
        #screen-section {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0; /* Предотвращает схлопывание в 0px на телефонах */
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
            padding: 4px;
        }
        canvas {
            display: block;
            background-color: #0b0e14;
            width: auto;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 640 / 448; /* Фиксирует пропорции 16-бит экрана */
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
            background-size: 100% 4px;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        #top-bar {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            z-index: 20;
        }
        .btn-top {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #475569;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .btn-top:active { background: #38bdf8; color: #000; }

        /* --- СЕНСОРНЫЙ ГЕЙМПАД --- */
        #gamepad-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #0f1422;
            position: relative;
            border-top: 2px solid #1e293b;
            touch-action: none;
        }

        #joystick-touch-area {
            flex: 1 1 45%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: none;
        }
        #joystick-base {
            width: 136px;
            height: 136px;
            background: radial-gradient(circle, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 2px solid #38bdf8;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }
        #joystick-stick {
            width: 54px;
            height: 54px;
            background: radial-gradient(circle, #38bdf8, #0284c7);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 41px;
            left: 41px;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        #actions-touch-area {
            flex: 1 1 55%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
            align-content: center;
            justify-items: center;
            align-items: center;
            touch-action: none;
        }
        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 22px;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 5px 12px rgba(0,0,0,0.7);
            touch-action: none;
            cursor: pointer;
        }
        .touch-btn:active {
            transform: scale(0.9);
            filter: brightness(1.3);
        }
        .btn-label {
            font-size: 8px;
            font-weight: 800;
            margin-top: -2px;
            text-transform: uppercase;
        }

        .btn-atk { background: radial-gradient(circle, #f59e0b, #b45309); border-color: #fbbf24; grid-column: 2; grid-row: 2; width: 68px; height: 68px; font-size: 26px; }
        .btn-def { background: radial-gradient(circle, #8b5cf6, #5b21b6); border-color: #a78bfa; grid-column: 1; grid-row: 2; }
        .btn-ice { background: radial-gradient(circle, #38bdf8, #0369a1); border-color: #7dd3fc; grid-column: 2; grid-row: 1; }
        .btn-dash { background: radial-gradient(circle, #10b981, #047857); border-color: #34d399; grid-column: 3; grid-row: 2; }
        .btn-ult { background: radial-gradient(circle, #f43f5e, #be123c); border-color: #fda4af; grid-column: 3; grid-row: 1; }

        .pc-help {
            margin-top: 8px;
            font-size: 11px;
            font-family: monospace;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .key {
            color: #fbbf24;
            font-weight: bold;
            background: #1e293b;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid #475569;
        }

        /* --- СТИЛИ ДЛЯ РЕЖИМА ПК --- */
        body.mode-pc #gamepad-section { display: none !important; }
        body.mode-pc #console-wrapper {
            max-width: 840px;
            max-height: 600px;
            height: auto;
            border-radius: 12px;
            border: 2px solid #374151;
            padding: 8px;
            background: linear-gradient(145deg, #1b202e, #0c0e14);
            box-shadow: 0 20px 60px rgba(0,0,0,0.95), 0 0 35px rgba(56, 189, 248, 0.2);
        }
        body.mode-pc #screen-section {
            height: 560px;
            width: 800px;
            border-radius: 6px;
        }
        body.mode-pc .pc-help { display: flex; }

        /* --- СТИЛИ ДЛЯ РЕЖИМА ТЕЛЕФОНА --- */
        body.mode-mobile #console-wrapper {
            width: 100%;
            height: 100%;
            max-width: 500px;
        }
        body.mode-mobile #screen-section { flex: 1 1 52%; }
        body.mode-mobile #gamepad-section { flex: 1 1 48%; display: flex; }
        body.mode-mobile .pc-help { display: none !important; }
    </style>
</head>
<body class="mode-pc">

<div id="console-wrapper">
    <div id="screen-section">
        <canvas id="game" width="640" height="448"></canvas>
        <div class="scanlines"></div>

        <div id="top-bar">
            <button class="btn-top" id="btn-mode-toggle">🖥️ ПК / 📱 ТЕЛ</button>
            <button class="btn-top" id="btn-inv">🎒 ИНВЕНТАРЬ</button>
            <button class="btn-top" id="btn-swap">🔄 СМЕНА</button>
            <button class="btn-top" id="btn-restart">🔁 R</button>
        </div>
    </div>

    <!-- СЕНСОРНЫЙ ГЕЙМПАД -->
    <div id="gamepad-section">
        <div id="joystick-touch-area">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <div id="actions-touch-area">
            <div class="touch-btn btn-ice" id="btn-ice">❄️<span class="btn-label">ЛЁД</span></div>
            <div class="touch-btn btn-ult" id="btn-ult">⚡<span class="btn-label">УЛЬТА</span></div>
            <div class="touch-btn btn-def" id="btn-def">🛡️<span class="btn-label">ЩИТ</span></div>
            <div class="touch-btn btn-atk" id="btn-atk">⚔️<span class="btn-label">УДАР</span></div>
            <div class="touch-btn btn-dash" id="btn-dash">💨<span class="btn-label">ДЭШ</span></div>
        </div>
    </div>
</div>

<div class="pc-help">
    <div><span class="key">WASD</span> Бег</div>
    <div><span class="key">ПКМ</span> Удар</div>
    <div><span class="key">ЛКМ</span> Щит / Парирование</div>
    <div><span class="key">СКМ / F</span> Сюрикен 🧊</div>
    <div><span class="key">E</span> Ульта</div>
    <div><span class="key">SHIFT</span> Дэш</div>
    <div><span class="key">TAB</span> Инвентарь</div>
</div>

<script>
// --- ТОЧНОЕ ОПРЕДЕЛЕНИЕ ПЛАТФОРМЫ (ПК ИЛИ ТЕЛЕФОН) ---
function detectPlatform() {
    // Проверяем наличие мыши и hover (ПК)
    const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const isMobileWidth = window.innerWidth < 640;
    
    if (isDesktop && !isMobileWidth) {
        document.body.className = 'mode-pc';
    } else {
        document.body.className = 'mode-mobile';
    }
}
detectPlatform();

function toggleMode() {
    if (document.body.classList.contains('mode-pc')) {
        document.body.className = 'mode-mobile';
    } else {
        document.body.className = 'mode-pc';
    }
}
document.getElementById('btn-mode-toggle').addEventListener('click', toggleMode);

// --- 16-BIT AUDIO ENGINE ---
let actx = null;
let bgmTimer = null;
let bgmStep = 0;
let musicEnabled = true;

function initAudio() {
    try {
        if (!actx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                actx = new AudioCtx();
                startBGM();
            }
        } else if (actx.state === 'suspended') {
            actx.resume();
        }
    } catch (e) {}
}

window.addEventListener('pointerdown', initAudio, { once: true });
window.addEventListener('keydown', initAudio, { once: true });

const bassNotes = [110, 110, 130, 110, 146, 110, 130, 123];
const leadNotes = [220, 0, 261, 293, 329, 293, 261, 0, 329, 392, 440, 392, 329, 293, 261, 246];
const victoryLead = [329, 392, 523, 659, 783, 659, 523, 392, 440, 554, 659, 880, 783, 659, 523, 659];

function startBGM() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
        try {
            if (!musicEnabled || !actx || inventoryOpen || transition.active || document.hidden) return;
            const t = actx.currentTime;

            if (gameState === 'VICTORY') {
                const note = victoryLead[bgmStep % victoryLead.length];
                const vOsc = actx.createOscillator();
                const vGain = actx.createGain();
                vOsc.type = 'triangle';
                vOsc.frequency.setValueAtTime(note, t);
                vGain.gain.setValueAtTime(0.04, t);
                vGain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
                vOsc.connect(vGain); vGain.connect(actx.destination);
                vOsc.start(t); vOsc.stop(t + 0.16);
                bgmStep++;
                return;
            }

            const bFreq = bassNotes[bgmStep % bassNotes.length];
            const bOsc = actx.createOscillator();
            const bGain = actx.createGain();
            bOsc.type = 'sawtooth';
            bOsc.frequency.setValueAtTime((currentRoom === 'THRONE' ? bFreq * 1.2 : bFreq) / 2, t);
            bGain.gain.setValueAtTime(0.04, t);
            bGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            bOsc.connect(bGain); bGain.connect(actx.destination);
            bOsc.start(t); bOsc.stop(t + 0.18);

            const lFreq = leadNotes[bgmStep % leadNotes.length];
            if (lFreq > 0) {
                const lOsc = actx.createOscillator();
                const lGain = actx.createGain();
                lOsc.type = 'square';
                lOsc.frequency.setValueAtTime(currentRoom === 'THRONE' ? lFreq * 1.2 : lFreq, t);
                lGain.gain.setValueAtTime(0.02, t);
                lGain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                lOsc.connect(lGain); lGain.connect(actx.destination);
                lOsc.start(t); lOsc.stop(t + 0.15);
            }
            bgmStep++;
        } catch (e) {}
    }, 150);
}

function playSound(type) {
    if (!actx || document.hidden) return;
    try {
        const t = actx.currentTime;
        if (type === 'slash') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(360, t);
            osc.frequency.exponentialRampToValueAtTime(70, t + 0.1);
            gain.gain.setValueAtTime(0.25, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'frost_shuriken') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(1600, t + 0.15);
            gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'freeze') {
            [1046, 1318].forEach((f, i) => {
                const osc = actx.createOscillator(); const gain = actx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(f, t + i * 0.04);
                gain.gain.setValueAtTime(0.15, t + i * 0.04);
                gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.06);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(t + i * 0.04); osc.stop(t + (i + 1) * 0.06);
            });
        } else if (type === 'parry') {
            const osc1 = actx.createOscillator(); const gain1 = actx.createGain();
            osc1.type = 'square'; osc1.frequency.setValueAtTime(987, t);
            gain1.gain.setValueAtTime(0.3, t); gain1.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc1.connect(gain1); gain1.connect(actx.destination);
            osc1.start(t); osc1.stop(t + 0.2);
        } else if (type === 'door_unlock') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(783, t);
            gain.gain.setValueAtTime(0.25, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'door_slam') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t);
            gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'spawn_portal') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(200, t);
            osc.frequency.linearRampToValueAtTime(500, t + 0.15);
            gain.gain.setValueAtTime(0.12, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'block') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(200, t);
            gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'ult_cast') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(554, t);
            gain.gain.setValueAtTime(0.25, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.3);
        } else if (type === 'coin' || type === 'potion') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(1000, t);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.08);
        } else if (type === 'golden_beam') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t);
            gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.12);
        } else if (type === 'fanfare') {
            [440, 659, 880].forEach((f, i) => {
                const osc = actx.createOscillator(); const gain = actx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(f, t + i * 0.1);
                gain.gain.setValueAtTime(0.2, t + i * 0.1);
                gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.1);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(t + i * 0.1); osc.stop(t + (i + 1) * 0.1);
            });
        } else if (type === 'hit') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(130, t);
            gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(t); osc.stop(t + 0.08);
        } else if (type === 'item') {
            [523, 783].forEach((f, i) => {
                const osc = actx.createOscillator(); const gain = actx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(f, t + i * 0.06);
                gain.gain.setValueAtTime(0.2, t + i * 0.06);
                gain.gain.linearRampToValueAtTime(0.01, t + (i + 1) * 0.06);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(t + i * 0.06); osc.stop(t + (i + 1) * 0.06);
            });
        }
    } catch(err) {}
}

// --- CANVAS & INPUT ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const keys = {};
let inventoryOpen = false;

window.addEventListener('contextmenu', e => e.preventDefault());

let mousePos = { x: 160, y: 112 };
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = 320 / (rect.width || 1);
    const scaleY = 224 / (rect.height || 1);
    mousePos.x = (e.clientX - rect.left) * scaleX;
    mousePos.y = (e.clientY - rect.top) * scaleY;
});

window.addEventListener('mousedown', e => {
    initAudio();
    if (gameState === 'VICTORY') {
        triggerStreamReaction();
        return;
    }
    if (e.button === 0) raiseShield();
    else if (e.button === 1) { e.preventDefault(); shootFrostShuriken(); }
    else if (e.button === 2) { e.preventDefault(); performMeleeAttack(); }
});

window.addEventListener('mouseup', e => {
    if (e.button === 0) player.isShielding = false;
});

window.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    if (e.code === 'KeyM') musicEnabled = !musicEnabled;
    if (e.code === 'KeyR') resetGame();
    if (e.code === 'KeyQ') switchWeapon();
    if (e.code === 'KeyE') activateUltimate();
    if (e.code === 'KeyF' || e.code === 'KeyX') shootFrostShuriken();
    if (e.code === 'KeyI' || e.code === 'Tab') { e.preventDefault(); inventoryOpen = !inventoryOpen; }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// --- ПЛАВАЮЩИЙ СЕНСОРНЫЙ ДЖОЙСТИК ---
const touchJoystick = {
    active: false,
    startX: 0, startY: 0,
    x: 0, y: 0,
    touchId: null
};

const joyArea = document.getElementById('joystick-touch-area');
const joyStick = document.getElementById('joystick-stick');

function handleJoyStart(e) {
    e.preventDefault();
    initAudio();
    if (gameState === 'VICTORY') return;
    const touch = e.changedTouches[0];
    touchJoystick.active = true;
    touchJoystick.touchId = touch.identifier;
    touchJoystick.startX = touch.clientX;
    touchJoystick.startY = touch.clientY;
    touchJoystick.x = 0; touchJoystick.y = 0;
    joyStick.style.transform = `translate(0px, 0px)`;
}

function handleJoyMove(e) {
    e.preventDefault();
    if (!touchJoystick.active) return;

    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === touchJoystick.touchId) {
            const dx = touch.clientX - touchJoystick.startX;
            const dy = touch.clientY - touchJoystick.startY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = 45;

            let normX = dx / (dist || 1);
            let normY = dy / (dist || 1);
            let clamped = Math.min(dist, maxRadius);

            joyStick.style.transform = `translate(${normX * clamped}px, ${normY * clamped}px)`;

            if (dist > 6) {
                touchJoystick.x = normX * (clamped / maxRadius);
                touchJoystick.y = normY * (clamped / maxRadius);
            } else {
                touchJoystick.x = 0; touchJoystick.y = 0;
            }
            break;
        }
    }
}

function handleJoyEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchJoystick.touchId) {
            touchJoystick.active = false;
            touchJoystick.touchId = null;
            touchJoystick.x = 0; touchJoystick.y = 0;
            joyStick.style.transform = `translate(0px, 0px)`;
            break;
        }
    }
}

joyArea.addEventListener('touchstart', handleJoyStart, { passive: false });
joyArea.addEventListener('touchmove', handleJoyMove, { passive: false });
joyArea.addEventListener('touchend', handleJoyEnd, { passive: false });
joyArea.addEventListener('touchcancel', handleJoyEnd, { passive: false });

function bindTouch(id, onDown, onUp) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        initAudio();
        btn.classList.add('active');
        if (onDown) onDown();
    }, { passive: false });

    btn.addEventListener('touchend', e => {
        e.preventDefault();
        btn.classList.remove('active');
        if (onUp) onUp();
    }, { passive: false });

    btn.addEventListener('touchcancel', () => {
        btn.classList.remove('active');
        if (onUp) onUp();
    });
}

function triggerDash() {

        let sx = touchJoystick.active ? touchJoystick.x : 0;
        let sy = touchJoystick.active ? touchJoystick.y : 0;
        if (sx === 0 && sy === 0) {
            if (player.facing === 'up') sy = -1;
            if (player.facing === 'down') sy = 1;
            if (player.facing === 'left') sx = -1;
            if (player.facing === 'right') sx = 1;
        }
        const len = Math.hypot(sx, sy) || 1;
        player.isSliding = true;
        player.slideTimer = 18;
        player.slideDir = { x: sx / len, y: sy / len };
        player.sp -= 20;
        player.invul = 20;
        playSound('item');
    }
}

// --- RENDER HELPERS (ОБЪЁМНЫЙ 16-BIT АРТ) ---
function drawShadow(x, y, w, h) {
    ctx.fillStyle = 'rgba(5, 7, 13, 0.45)';
    ctx.beginPath();
    ctx.ellipse((x + w / 2) | 0, (y + h) | 0, (w / 2.1) | 0, 3, 0, 0, Math.PI * 2);
    ctx.fill();
}

function draw16BitPortal(p) {
    const px = p.x | 0, py = p.y | 0;
    const progress = 1 - (p.timer / p.maxTimer);
    ctx.save();
    ctx.translate(px + 7, py + 7);
    ctx.rotate(Date.now() * 0.01);
    ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, (8 * progress + 2) | 0, (4 * progress + 1) | 0, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#7c3aed'; ctx.beginPath(); ctx.arc(0, 0, (4 * progress + 1) | 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function draw16BitChest(c) {
    const cx = c.x | 0, cy = c.y | 0;
    drawShadow(cx, cy, 16, 14);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(cx, cy, 16, 14);
    if (c.opened) {
        ctx.fillStyle = '#78350f'; ctx.fillRect(cx + 1, cy + 5, 14, 8);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(cx + 2, cy + 2, 12, 4);
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(cx + 1, cy + 6, 14, 2);
    } else {
        ctx.fillStyle = '#92400e'; ctx.fillRect(cx + 1, cy + 1, 14, 12);
        ctx.fillStyle = '#b45309'; ctx.fillRect(cx + 2, cy + 2, 12, 10);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(cx + 2, cy + 1, 2, 12); ctx.fillRect(cx + 12, cy + 1, 2, 12); ctx.fillRect(cx + 7, cy + 6, 2, 3);
    }
}

function draw16BitPotion(d) {
    const dx = d.x | 0;
    const dy = (d.y + Math.sin(Date.now() * 0.006 + d.bobTimer) * 2) | 0;
    drawShadow(dx, dy + 2, 8, 8);

    if (d.type === 'potion_hp') {
        ctx.fillStyle = '#881337'; ctx.fillRect(dx + 2, dy, 4, 2);
        ctx.fillStyle = '#be123c'; ctx.fillRect(dx + 1, dy + 2, 6, 7);
        ctx.fillStyle = '#fb7185'; ctx.fillRect(dx + 2, dy + 3, 2, 2);
    } else if (d.type === 'potion_sp') {
        ctx.fillStyle = '#0369a1'; ctx.fillRect(dx + 2, dy, 4, 2);
        ctx.fillStyle = '#0284c7'; ctx.fillRect(dx + 1, dy + 2, 6, 7);
        ctx.fillStyle = '#7dd3fc'; ctx.fillRect(dx + 2, dy + 3, 2, 2);
    } else if (d.type === 'star_hype') {
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(dx + 1, dy + 1, 6, 6);
        ctx.fillStyle = '#fff'; ctx.fillRect(dx + 2, dy + 2, 2, 2);
    }
}

function draw16BitPenguin(p) {
    const px = p.x | 0, py = p.y | 0;
    drawShadow(px, py, p.w, p.h);

    if (p.holdTimer > 0) {
        ctx.fillStyle = '#0b0f19'; ctx.fillRect(px + 2, py + 4, 12, 14);
        ctx.fillStyle = '#cbd5e1'; ctx.fillRect(px + 4, py + 8, 8, 9);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(px + 6, py + 8, 4, 3);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(px + 1, py + 2, 3, 6); ctx.fillRect(px + 12, py + 2, 3, 6);
        if (p.holdingItem === 'golden_fish') {
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(px + 3, py - 10, 10, 6);
            ctx.fillStyle = '#fff'; ctx.fillRect(px + 5, py - 9, 6, 2);
        } else if (p.holdingItem === 'armored_scarf') {
            ctx.fillStyle = '#94a3b8'; ctx.fillRect(px + 3, py - 8, 10, 4);
            ctx.fillStyle = '#475569'; ctx.fillRect(px + 6, py - 9, 4, 6);
        }
        return;
    }

    if (p.isSliding) {
        ctx.fillStyle = '#0b0f19'; ctx.fillRect(px, py + 6, 18, 10);
        ctx.fillStyle = '#cbd5e1'; ctx.fillRect(px + 2, py + 10, 14, 5);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(px + 2, py + 7, 14, 4);
        ctx.fillStyle = p.armor === 'armored_scarf' ? '#94a3b8' : '#e11d48';
        ctx.fillRect(px + (p.facing === 'left' ? 2 : 12), py + 6, 4, 3);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(px + (p.facing === 'left' ? -2 : 16), py + 8, 4, 3);
        return;
    }

    const bounce = p.walkFrame === 1 ? -1 : 0;
    ctx.fillStyle = '#0b0f19'; ctx.fillRect(px + 2, py + bounce, 12, 18);
    ctx.fillStyle = '#1e293b'; ctx.fillRect(px + 2, py + 1 + bounce, 12, 15);
    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(px + 4, py + 6 + bounce, 8, 9);
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(px + 5, py + 6 + bounce, 6, 7);

    if (p.armor === 'armored_scarf') {
        ctx.fillStyle = '#475569'; ctx.fillRect(px + 3, py + 5 + bounce, 10, 3);
        ctx.fillStyle = '#94a3b8'; ctx.fillRect(px + 4, py + 5 + bounce, 8, 2);
        ctx.fillStyle = '#f8fafc'; ctx.fillRect(px + 6, py + 5 + bounce, 2, 1);
    } else {
        ctx.fillStyle = '#9f1239'; ctx.fillRect(px + 3, py + 5 + bounce, 10, 3);
        ctx.fillStyle = '#e11d48'; ctx.fillRect(px + 4, py + 5 + bounce, 8, 2);
    }

    ctx.fillStyle = '#0f172a';
    if (p.facing === 'left') {
        ctx.fillRect(px + 3, py + 3 + bounce, 2, 3); ctx.fillStyle = '#fff'; ctx.fillRect(px + 3, py + 3 + bounce, 1, 1);
    } else if (p.facing === 'right') {
        ctx.fillRect(px + 11, py + 3 + bounce, 2, 3); ctx.fillStyle = '#fff'; ctx.fillRect(px + 12, py + 3 + bounce, 1, 1);
    } else {
        ctx.fillRect(px + 4, py + 3 + bounce, 2, 3); ctx.fillRect(px + 10, py + 3 + bounce, 2, 3);
        ctx.fillStyle = '#fff'; ctx.fillRect(px + 4, py + 3 + bounce, 1, 1); ctx.fillRect(px + 10, py + 3 + bounce, 1, 1);
    }

    ctx.fillStyle = '#d97706'; ctx.fillRect(px + 6, py + 5 + bounce, 4, 3);
    ctx.fillStyle = '#ea580c'; ctx.fillRect(px + 3, py + 16, 3, 2); ctx.fillRect(px + 10, py + 16, 3, 2);

    if (p.isShielding) {
        ctx.save();
        ctx.translate(px + 8, py + 9);
        let angle = 0;
        if (p.facing === 'right') angle = 0;
        if (p.facing === 'down') angle = Math.PI / 2;
        if (p.facing === 'left') angle = Math.PI;
        if (p.facing === 'up') angle = -Math.PI / 2;
        ctx.rotate(angle);
        ctx.fillStyle = p.parryWindow > 0 ? '#38bdf8' : '#0284c7'; ctx.fillRect(10, -7, 4, 14);
        ctx.fillStyle = '#e0f2fe'; ctx.fillRect(11, -5, 2, 10);
        ctx.restore();
    }

    if (p.isAttacking) {
        ctx.save();
        ctx.translate(px + 8, py + 8);
        let angle = 0;
        if (p.facing === 'right') angle = 0;
        if (p.facing === 'down') angle = Math.PI / 2;
        if (p.facing === 'left') angle = Math.PI;
        if (p.facing === 'up') angle = -Math.PI / 2;
        ctx.rotate(angle);
        const isGold = p.weapon === 'golden_fish';
        ctx.strokeStyle = isGold ? '#fbbf24' : '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(4, 0, 18, -Math.PI / 3, Math.PI / 3); ctx.stroke();
        ctx.fillStyle = isGold ? '#d97706' : '#0284c7'; ctx.fillRect(10, -4, 12, 7);
        ctx.restore();
    }
}

function draw16BitBoss(b) {
    const bx = b.x | 0, by = b.y | 0;
    drawShadow(bx, by, b.w, b.h);
    if (b.invul > 0 && b.invul % 4 > 2) return;

    ctx.fillStyle = b.isRage ? '#991b1b' : '#0f172a';
    ctx.fillRect(bx + 2, by, 24, 30); ctx.fillRect(bx, by + 4, 28, 24);
    ctx.fillStyle = b.isRage ? '#7f1d1d' : '#1e3a29';
    ctx.fillRect(bx + 4, by + 1, 20, 7);
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx + 11, by + 3, 6, 4);

    ctx.fillStyle = b.isRage ? '#fca5a5' : '#fbcfe8';
    ctx.fillRect(bx + 6, by + 10, 16, 9);
    ctx.fillStyle = '#111'; ctx.fillRect(bx + 8, by + 12, 3, 2); ctx.fillRect(bx + 17, by + 12, 3, 2);
    ctx.fillStyle = '#881337'; ctx.fillRect(bx + 12, by + 16, 4, 1);

    ctx.fillStyle = b.isRage ? '#991b1b' : '#14532d';
    ctx.fillRect(bx + 4, by + 19, 20, 11);
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx + 2, by + 19, 4, 4); ctx.fillRect(bx + 22, by + 19, 4, 4);

    ctx.fillStyle = '#0f172a'; ctx.fillRect(bx + 5, by + 23, 18, 9);
    ctx.fillStyle = b.isRage ? '#ef4444' : '#22c55e'; ctx.fillRect(bx + 13, by + 24, 3, 3);
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(bx + 18, by + 25, 2, 2);

    if (b.state === 'OVERHEAT') {
        if (Math.floor(Date.now() / 200) % 2 === 0) {
            ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 7px monospace'; ctx.fillText("БЕЙ!", bx + 6, by - 6);
        }
    }
}

function draw16BitMinion(m) {
    const mx = m.x | 0, my = m.y | 0;
    drawShadow(mx, my, 14, 14);
    if (m.invul > 0 && m.invul % 4 > 2) return;

    ctx.fillStyle = '#1e1b4b'; ctx.fillRect(mx + 1, my, 12, 14);
    ctx.fillStyle = '#7c3aed'; ctx.fillRect(mx + 2, my + 2, 10, 10);
    ctx.fillStyle = '#09090b'; ctx.fillRect(mx + 2, my + 5, 10, 3);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(mx + 3, my + 5, 2, 1); ctx.fillRect(mx + 8, my + 5, 2, 1);

    if (m.freezeTimer > 0) {
        ctx.fillStyle = 'rgba(165, 243, 252, 0.65)';
        ctx.fillRect(mx - 2, my - 2, 18, 18);
        ctx.strokeStyle = '#38bdf8';
        ctx.strokeRect(mx - 2, my - 2, 18, 18);
    }
}

function draw16BitFavoritStreamer(x, y) {
    ctx.fillStyle = '#3e2723';
    ctx.fillRect(x + 12, y, 24, 10); ctx.fillRect(x + 8, y + 4, 32, 8);
    ctx.fillStyle = '#ffd1b3'; ctx.fillRect(x + 12, y + 10, 24, 22);
    ctx.fillStyle = '#3e2723'; ctx.fillRect(x + 16, y + 16, 4, 3); ctx.fillRect(x + 28, y + 16, 4, 3);
    ctx.fillStyle = '#b71c1c'; ctx.fillRect(x + 20, y + 24, 8, 3);
    ctx.fillStyle = '#6d4c41'; ctx.fillRect(x + 16, y + 28, 16, 3);

    // ФУТБОЛКА ЭВЕРТОНА
    ctx.fillStyle = '#003399'; ctx.fillRect(x + 4, y + 32, 40, 36);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 18, y + 32, 12, 6);
    ctx.fillStyle = '#003399'; ctx.fillRect(x + 22, y + 32, 4, 4);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 10, y + 40, 6, 6);

    // Микрофон
    ctx.fillStyle = '#475569'; ctx.fillRect(x + 28, y + 38, 10, 16);
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(x + 30, y + 36, 6, 8);
    ctx.fillStyle = '#1e293b'; ctx.fillRect(x + 32, y + 54, 2, 14);
}

// --- RENDER ---
function draw() {
    ctx.save();

    // ==========================================
    // ЭКРАН ПОБЕДЫ: СТРИМ ФАВОРИТА (EVERTON)
    // ==========================================
    if (gameState === 'VICTORY') {
        ctx.fillStyle = '#090d16'; ctx.fillRect(0, 0, 640, 448);

        ctx.fillStyle = '#0f172a'; ctx.fillRect(16, 12, 608, 38);
        ctx.strokeStyle = '#38bdf8'; ctx.strokeRect(16, 12, 608, 38);

        ctx.fillStyle = '#ef4444'; ctx.fillRect(28, 22, 10, 10);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace';
        ctx.fillText("В ЭФИРЕ", 44, 31);

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 13px monospace';
        ctx.fillText("Стрим Фаворита: СЕГОДНЯ В 19:00 ПО РАСПИСАНИЮ!", 120, 31);

        ctx.fillStyle = '#94a3b8'; ctx.font = '11px monospace';
        ctx.fillText("👁️ 14,880 зрителей", 480, 31);

        ctx.fillStyle = '#000'; ctx.fillRect(16, 58, 380, 320);
        ctx.strokeStyle = '#003399'; ctx.lineWidth = 3;
        ctx.strokeRect(16, 58, 380, 320);

        ctx.fillStyle = '#0a192f'; ctx.fillRect(19, 61, 374, 314);

        ctx.save();
        ctx.translate(150, 150);
        ctx.scale(3.2, 3.2);
        draw16BitFavoritStreamer(0, 0);
        ctx.restore();

        ctx.fillStyle = 'rgba(0, 40, 117, 0.9)';
        ctx.fillRect(24, 330, 364, 38);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace';
        ctx.fillText("⚽ ФК ЭВЕРТОН — ТОЛЬКО ПОБЕДА! 💙", 36, 354);

        ctx.fillStyle = '#0b1120'; ctx.fillRect(404, 58, 220, 320);
        ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
        ctx.strokeRect(404, 58, 220, 320);

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 12px monospace';
        ctx.fillText("💬 ЧАТ СТРИМА", 416, 78);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(412, 86, 204, 2);

        for (let i = 0; i < streamChat.length; i++) {
            const msg = streamChat[i];
            const my = 110 + i * 36;
            ctx.fillStyle = msg.color; ctx.font = 'bold 10px monospace';
            ctx.fillText(msg.user, 414, my);
            ctx.fillStyle = '#f8fafc'; ctx.font = '10px monospace';
            ctx.fillText(msg.text, 414, my + 14);
        }

        streamReactionParticles.forEach(rp => {
            ctx.font = '16px monospace';
            ctx.fillText(rp.char, rp.x, rp.y);
        });

        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 14px monospace';
        ctx.fillText("★ ПОБЕДА! ПИНГВИН СПАС РАСПИСАНИЕ ★", 30, 415);

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 12px monospace';
        ctx.fillText("[❤️ КЛИК / УДАР] — ОТПРАВИТЬ СЕРДЕЧКО НА СТРИМ", 30, 435);

        ctx.fillStyle = '#4ade80'; ctx.font = 'bold 12px monospace';
        ctx.fillText("[🔁 R] — СЫГРАТЬ СНОВА", 450, 425);

        ctx.restore();
        return;
    }

    // ==========================================
    // СЛОЙ 1: ПИКСЕЛЬНЫЙ МИР (640x448)
    // ==========================================
    ctx.save();
    ctx.scale(2, 2);

    if (screenShake > 0.5) {
        ctx.translate(((Math.random() - 0.5) * screenShake) | 0, ((Math.random() - 0.5) * screenShake) | 0);
    }

    if (currentRoom === 'CATACOMBS') {
        // Фоновые плиты пола с 3D фаской
        ctx.fillStyle = '#0a0d16'; ctx.fillRect(0, 0, 320, 224);
        for (let y = 24; y < 196; y += 24) {
            for (let x = 16; x < 304; x += 24) {
                ctx.fillStyle = '#161b29'; ctx.fillRect(x, y, 23, 23);
                ctx.fillStyle = '#262f45'; ctx.fillRect(x, y, 23, 1); ctx.fillRect(x, y, 1, 23);
                ctx.fillStyle = '#0c0f17'; ctx.fillRect(x, y + 22, 23, 1); ctx.fillRect(x + 22, y, 1, 23);
            }
        }
        ctx.fillStyle = '#06080e';
        ctx.fillRect(0, 0, 320, 24); ctx.fillRect(0, 196, 320, 28);
        ctx.fillRect(0, 0, 16, 224); ctx.fillRect(304, 0, 16, 224);
        ctx.strokeStyle = '#334155'; ctx.strokeRect(15, 23, 290, 174);

        if (gateOpened) {
            ctx.fillStyle = '#020617'; ctx.fillRect(136, 4, 48, 20);
            ctx.strokeStyle = '#38bdf8'; ctx.strokeRect(136, 4, 48, 20);
        } else {
            ctx.fillStyle = '#1e293b'; ctx.fillRect(136, 4, 48, 20);
            ctx.strokeStyle = '#475569'; ctx.strokeRect(136, 4, 48, 20);
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = (player.schedules > i) ? '#38bdf8' : '#64748b';
                ctx.fillRect(144 + i * 12, 10, 6, 8);
            }
        }

        // Динамическое свечение факелов
        catacombsTorches.forEach(t => {
            const rad = ctx.createRadialGradient(t.x + 3, t.y + 3, 2, t.x + 3, t.y + 3, 40);
            rad.addColorStop(0, 'rgba(251, 191, 36, 0.22)');
            rad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = rad;
            ctx.fillRect(t.x - 40, t.y - 40, 86, 86);

            ctx.fillStyle = '#475569'; ctx.fillRect(t.x + 2, t.y + 4, 4, 6);
            const colors = ['#f59e0b', '#ef4444', '#fef08a'];
            ctx.fillStyle = colors[torchFrame % colors.length];
            ctx.fillRect(t.x + 1, t.y - 1, 6, 6);
        });

        chests.forEach(draw16BitChest);
        drops.forEach(draw16BitPotion);

        scrolls.forEach(s => {
            if (s.collected) return;
            const sy = (s.y + Math.sin(Date.now() * 0.005 + s.x) * 2) | 0;
            drawShadow(s.x, sy + 3, 12, 10);
            ctx.fillStyle = '#78350f'; ctx.fillRect(s.x, sy, 12, 11);
            ctx.fillStyle = '#fef3c7'; ctx.fillRect(s.x + 1, sy + 1, 10, 9);
            ctx.fillStyle = '#b45309'; ctx.fillRect(s.x + 3, sy + 3, 6, 1);
        });

        spawnPortals.forEach(draw16BitPortal);
        minions.forEach(m => { if (m.hp > 0 && !m.dead) draw16BitMinion(m); });
    }

    if (currentRoom === 'THRONE') {
        ctx.fillStyle = '#140810'; ctx.fillRect(0, 0, 320, 224);
        for (let y = 24; y < 196; y += 24) {
            for (let x = 16; x < 304; x += 24) {
                ctx.fillStyle = '#24101e'; ctx.fillRect(x, y, 23, 23);
                ctx.fillStyle = '#4a1d37'; ctx.fillRect(x, y, 23, 1); ctx.fillRect(x, y, 1, 23);
            }
        }
        // Красный ковёр
        ctx.fillStyle = '#881337'; ctx.fillRect(130, 24, 60, 172);
        ctx.fillStyle = '#be123c'; ctx.fillRect(134, 24, 52, 172);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(130, 24, 2, 172); ctx.fillRect(188, 24, 2, 172);

        // Трон
        ctx.fillStyle = '#0f172a'; ctx.fillRect(136, 10, 48, 26);
        ctx.fillStyle = '#1e3a29'; ctx.fillRect(140, 12, 40, 22);
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(148, 14, 24, 4);

        // Баннеры Xbox
        ctx.fillStyle = '#107c10'; ctx.fillRect(36, 26, 16, 32); ctx.fillRect(268, 26, 16, 32);
        ctx.fillStyle = '#050204';
        ctx.fillRect(0, 0, 320, 24); ctx.fillRect(0, 196, 320, 28);
        ctx.fillRect(0, 0, 16, 224); ctx.fillRect(304, 0, 16, 224);
        ctx.strokeStyle = '#991b1b'; ctx.strokeRect(15, 23, 290, 174);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(136, 196, 48, 16);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(158, 202, 4, 4);

        throneTorches.forEach(t => {
            const rad = ctx.createRadialGradient(t.x + 3, t.y + 3, 2, t.x + 3, t.y + 3, 45);
            rad.addColorStop(0, 'rgba(251, 191, 36, 0.25)');
            rad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = rad;
            ctx.fillRect(t.x - 45, t.y - 45, 96, 96);

            ctx.fillStyle = '#fbbf24'; ctx.fillRect(t.x + 2, t.y + 4, 4, 6);
            const colors = ['#f59e0b', '#ef4444', '#fef08a'];
            ctx.fillStyle = colors[torchFrame % colors.length];
            ctx.fillRect(t.x + 1, t.y - 1, 6, 6);
        });

        drops.forEach(draw16BitPotion);

        if (boss.active && boss.hp > 0) {
            draw16BitBoss(boss);
            ctx.fillStyle = '#000'; ctx.fillRect(80, 8, 160, 9);
            ctx.fillStyle = boss.isRage ? '#dc2626' : '#991b1b';
            ctx.fillRect(81, 9, (boss.hp / boss.maxHp) * 158, 7);
            ctx.strokeStyle = '#f59e0b'; ctx.strokeRect(80, 8, 160, 9);
        }

        spawnPortals.forEach(draw16BitPortal);
        minions.forEach(m => { if (m.hp > 0 && !m.dead) draw16BitMinion(m); });
    }

    ultProjectiles.forEach(up => {
        if (up.type === 'giant_fish') {
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(up.x - 10, up.y - 6, 20, 12);
            ctx.fillStyle = '#fff'; ctx.fillRect(up.x - 4, up.y - 4, 8, 4);
        } else {
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(up.x - 3, up.y - 3, 6, 6);
        }
    });

    playerShots.forEach(ps => {
        if (ps.type === 'frost_shuriken') {
            ctx.save();
            ctx.translate(ps.x | 0, ps.y | 0);
            ctx.rotate(ps.rot);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-4, -1, 8, 2); ctx.fillRect(-1, -4, 2, 8);
            ctx.restore();
        } else {
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath(); ctx.arc(ps.x | 0, ps.y | 0, 5, 0, Math.PI * 2); ctx.fill();
        }
    });

    projectiles.forEach(pr => {
        ctx.fillStyle = pr.color;
        ctx.beginPath(); ctx.arc(pr.x | 0, pr.y | 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 6px monospace';
        ctx.fillText(pr.reflected ? "★" : pr.btn, (pr.x - 2) | 0, (pr.y + 2) | 0);
    });

    particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x | 0, p.y | 0, 2, 2); });

    if (player.hp > 0 && !(player.invul > 0 && player.invul % 4 > 2)) {
        draw16BitPenguin(player);
    }

    ctx.restore();

    // ==========================================
    // СЛОЙ 2: ЧЁТКИЙ UI И ТЕКСТ (640x448)
    // ==========================================
    if (currentRoom === 'THRONE' && boss.active && boss.hp > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(boss.isRage ? "ГЕНЕРАЛ 1:6 [RAGE MODE - RROD]" : "ГЕНЕРАЛ 1:6 (КОЛЯНЧИК)", 320, 14);
        ctx.textAlign = 'left';
    }

    if (currentRoom === 'CATACOMBS' && gateOpened) {
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 12px monospace';
        ctx.fillText("▲ ВХОД В ТРОННЫЙ ЗАЛ ▲", 240, 36);
    }

    floatingTexts.forEach(ft => {
        ctx.font = 'bold 14px monospace';
        ctx.fillStyle = '#000';
        ctx.fillText(ft.text, (ft.x * 2 + 1) | 0, (ft.y * 2 + 1) | 0);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, (ft.x * 2) | 0, (ft.y * 2) | 0);
    });

    for (let i = 0; i < player.maxHp / 2; i++) {
        const hVal = player.hp - i * 2;
        const hx = 40 + i * 22;
        ctx.fillStyle = '#0f172a'; ctx.fillRect(hx, 12, 18, 16);
        if (hVal >= 2) {
            ctx.fillStyle = '#ef4444'; ctx.fillRect(hx + 2, 14, 14, 12);
            ctx.fillStyle = '#fca5a5'; ctx.fillRect(hx + 4, 16, 4, 4);
        } else if (hVal === 1) {
            ctx.fillStyle = '#ef4444'; ctx.fillRect(hx + 2, 14, 7, 12);
        }
    }

    const isHypeMax = player.hype === player.maxHype;
    ctx.fillStyle = '#0f172a'; ctx.fillRect(40, 34, 100, 10);
    ctx.fillStyle = isHypeMax ? ((Math.floor(Date.now() / 150) % 2 === 0) ? '#fbbf24' : '#f43f5e') : '#a855f7';
    ctx.fillRect(40, 34, (player.hype / player.maxHype) * 100, 10);
    ctx.strokeStyle = '#475569'; ctx.strokeRect(40, 34, 100, 10);

    if (isHypeMax) {
        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 11px monospace';
        ctx.fillText("ULT READY!", 148, 43);
    }

    ctx.fillStyle = '#0f172a'; ctx.fillRect(460, 12, 70, 24);
    ctx.strokeStyle = '#475569'; ctx.strokeRect(460, 12, 70, 24);
    ctx.fillStyle = player.weapon === 'golden_fish' ? '#fbbf24' : '#38bdf8';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(player.weapon === 'golden_fish' ? "ЗОЛОТО" : "МЕЧ", 474, 28);

    ctx.fillStyle = '#fde68a'; ctx.font = 'bold 13px monospace';
    ctx.fillText(`СВИТКИ: ${player.schedules}/${player.totalSchedules}`, 540, 28);

    if (dialog.timer > 0) {
        const dy = 320;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.97)';
        ctx.fillRect(32, dy, 576, 104);
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
        ctx.strokeRect(32, dy, 576, 104);

        ctx.fillStyle = '#0f172a'; ctx.fillRect(44, dy + 12, 64, 64);
        ctx.strokeStyle = '#64748b'; ctx.strokeRect(44, dy + 12, 64, 64);

        if (dialog.portrait === 'penguin') {
            ctx.fillStyle = '#1e293b'; ctx.fillRect(52, dy + 20, 48, 48);
            ctx.fillStyle = '#cbd5e1'; ctx.fillRect(60, dy + 40, 32, 28);
            ctx.fillStyle = player.armor === 'armored_scarf' ? '#94a3b8' : '#e11d48';
            ctx.fillRect(56, dy + 36, 40, 8);
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(68, dy + 40, 16, 10);
            ctx.fillStyle = '#000'; ctx.fillRect(60, dy + 28, 8, 8); ctx.fillRect(84, dy + 28, 8, 8);
        } else {
            ctx.fillStyle = '#1e3a29'; ctx.fillRect(52, dy + 20, 48, 20);
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(70, dy + 24, 12, 8);
            ctx.fillStyle = '#fbcfe8'; ctx.fillRect(56, dy + 40, 40, 28);
        }

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 15px monospace';
        ctx.fillText(dialog.speaker, 124, dy + 26);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '13px monospace';
        const words = dialog.text.split(' ');
        let line = '', lineY = dy + 50;
        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            if (testLine.length > 46) {
                ctx.fillText(line, 124, lineY);
                line = words[n] + ' ';
                lineY += 18;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, 124, lineY);
    }

    if (inventoryOpen) {
        ctx.fillStyle = 'rgba(11, 15, 25, 0.96)';
        ctx.fillRect(60, 50, 520, 348);
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
        ctx.strokeRect(60, 50, 520, 348);

        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 18px monospace';
        ctx.fillText("=== МЕНЮ ЭКИПИРОВКИ ===", 190, 85);

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 14px monospace';
        ctx.fillText("[ОРУЖИЕ] (ПКМ / ⚔️):", 90, 130);
        ctx.fillStyle = '#fff'; ctx.font = '13px monospace';
        if (player.hasGoldenFish) {
            ctx.fillText(player.weapon === 'golden_fish' ? "► ЗОЛОТАЯ РЫБА (Урон: x2 + Волна)" : "  Синяя рыба-меч (Урон: 1)", 90, 155);
        } else {
            ctx.fillText("► Синяя рыба-меч (Урон: 1)", 90, 155);
            ctx.fillStyle = '#64748b'; ctx.fillText("  [?] Найдите золотой сундук!", 90, 175);
        }

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 14px monospace';
        ctx.fillText("[ДАЛЬНЯЯ МАГИЯ] (СКМ / ❄️):", 90, 215);
        ctx.fillStyle = '#fff'; ctx.font = '13px monospace';
        ctx.fillText("► Морозный Сюрикен (Заморозка врагов 1.5с 🧊)", 90, 240);

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 14px monospace';
        ctx.fillText("[БРОНЯ] (ЛКМ / 🛡️):", 90, 280);
        ctx.fillStyle = '#fff'; ctx.font = '13px monospace';
        if (player.hasArmoredScarf) {
            ctx.fillText("► Бронированный стальной шарф (+2 HP & Защита)", 90, 305);
        } else {
            ctx.fillText("► Обычный красный шарф", 90, 305);
        }

        ctx.fillStyle = '#9ca3af'; ctx.font = '12px monospace';
        ctx.fillText("Нажмите [ИНВЕНТАРЬ] или [TAB], чтобы закрыть", 170, 370);
    }

    if (transition.active) {
        ctx.fillStyle = `rgba(0, 0, 0, ${transition.alpha})`;
        ctx.fillRect(0, 0, 640, 448);
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(20, 5, 8, 0.94)';
        ctx.fillRect(0, 0, 640, 448);
        ctx.fillStyle = '#ef4444'; ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("ВЫ ПОГИБЛИ", 320, 190);
        ctx.fillStyle = '#f59e0b'; ctx.font = '14px monospace';
        ctx.fillText("Нажмите [🔁 R], чтобы начать заново", 320, 250);
        ctx.textAlign = 'left';
    }

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
